<!DOCTYPE html>

<title>Mon suivi — L'Atelier by</title>
<!-- La page du franchisé (24/10/2026) : ce qu'il ouvre avec son lien, sans mot de passe — ses points à travailler
     et l'envoi de la photo de correction, ce qui est à surveiller et ses chiffres de chaque jour, ses rapports de
     visite, sa prochaine visite annoncée, ses passages client mystère, le journal. Elle remplace l'ancienne page
     « Mon suivi » (dashboard/suivi.html, qui redirige ici). Le lien porte une clé propre au magasin (?shop=&jeton=) ; ?apercu=1 est la vue du bureau dans le
     cockpit : rien n'est envoyé, rien n'est marqué comme lu. Chemins RELATIFS : la page vit sous /suivi/, l'API
     sous ../api/cockpit (routes publiques /suivi/franchise). -->
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/ds/global.css">
<style>
