<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mon suivi — L'Atelier by</title>
<!-- La page du franchisé (24/10/2026) : ce qu'il ouvre avec son lien, sans mot de passe — ses points à travailler
     et l'envoi de la photo de correction, ses rapports de visite, sa prochaine visite annoncée, ses passages client
     mystère. Le lien porte une clé propre au magasin (?shop=&jeton=) ; ?apercu=1 est la vue du bureau dans le
     cockpit : rien n'est envoyé, rien n'est marqué comme lu. Chemins RELATIFS : la page vit sous /suivi/, l'API
     sous ../api/cockpit (routes publiques /suivi/franchise). -->
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/ds/global.css">
<style>
  body{margin:0;background:var(--color-background,#F6F1EC);color:var(--color-text,#222);font-family:var(--font-ui)}
  .fr{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
  .fr-hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.fr-hd img{height:30px}
  .fr-hd h1{font:400 26px/1.1 var(--font-display);margin:0}.fr-hd small{display:block;font-size:12px;color:var(--color-text-muted)}
  .fr-apercu{background:#FFF1D6;color:#8a5a00;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:600}
  .fr-carte{background:var(--color-surface,#fff);border:.5px solid var(--color-border-tertiary,#e5ddd5);border-radius:14px;padding:14px 16px}
  .fr-carte h2{font:400 20px/1.15 var(--font-display);margin:0 0 8px}
  .fr-mu{font-size:12.5px;color:var(--color-text-muted)}
  .fr-pro{background:#F4ECE6;border-color:#E6D3C6}.fr-pro b.d{display:block;font-size:15px}
  .fr-pro ul,.fr-rap ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.55}
  .fr-pt{border-top:.5px solid var(--color-border-tertiary,#e5ddd5);padding:12px 0;display:flex;flex-direction:column;gap:6px}.fr-pt:first-of-type{border-top:none;padding-top:0}
  .fr-pt .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.fr-pt .h b{font-size:14px;flex:1;min-width:0}
  .fr-p{font:700 10px var(--font-ui);letter-spacing:.06em;border-radius:999px;padding:3px 8px;white-space:nowrap;background:#EDE7E0;color:#444}.fr-p.p0{background:#C0182B;color:#fff}.fr-p.p1{background:#FFF1D6;color:#8a5a00}
  .fr-st{font-size:12px;font-weight:600}.fr-st.ko{color:#C0182B}.fr-st.att{color:#1d4f7a}.fr-st.vio{color:#4b3a8a}
  .fr-retour{background:#EDE9F7;color:#3b2d70;border-radius:8px;padding:7px 10px;font-size:12.5px}
  .fr-pt img.ph{width:120px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
  .fr-form{display:flex;flex-direction:column;gap:8px;background:var(--color-background-secondary,#F6F1EC);border-radius:10px;padding:10px}
  .fr-form .lig{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .fr-btn{border:.5px solid var(--color-border-secondary,#cfc5bb);background:var(--color-surface,#fff);border-radius:999px;min-height:40px;padding:0 16px;font:600 13px var(--font-ui);color:var(--color-text,#222);cursor:pointer}
  .fr-btn.prim{background:var(--color-primary,#8D1D2C);border-color:var(--color-primary,#8D1D2C);color:#fff}.fr-btn:disabled{opacity:.55;cursor:default}
  .fr-form textarea{width:100%;box-sizing:border-box;border:.5px solid var(--color-border-secondary,#cfc5bb);border-radius:8px;padding:8px 10px;font:13px/1.45 var(--font-ui);min-height:60px;background:var(--color-surface,#fff);color:inherit}
  .fr-form img.prev{width:140px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
  .fr-msg{font-size:12.5px;font-weight:600}.fr-msg.ok{color:#2d7a3e}.fr-msg.ko{color:#C0182B}
  .fr-val{font-size:12.5px;line-height:1.7;margin:0;padding-left:18px;color:#1f5a2e}
  details.fr-rap{border-top:.5px solid var(--color-border-tertiary,#e5ddd5)}details.fr-rap:first-of-type{border-top:none}
  details.fr-rap summary{list-style:none;cursor:pointer;padding:11px 26px 11px 0;position:relative}details.fr-rap summary::-webkit-details-marker{display:none}
  details.fr-rap summary::after{content:'▾';position:absolute;right:4px;top:12px;color:var(--color-text-muted)}details.fr-rap[open] summary::after{content:'▴'}
  details.fr-rap summary b{font-size:14px}details.fr-rap summary span{display:block;font-size:12.5px;color:var(--color-text-muted);margin-top:2px}
  .fr-new{font:700 9.5px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;background:var(--color-primary,#8D1D2C);color:#fff;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:2px}
  .fr-rap .c{padding:0 0 14px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.55}
  .fr-rap .c h3{font:600 10px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-muted);margin:0 0 2px}
  .fr-rap .c p{margin:0}.fr-phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}.fr-phs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
  .fr-msp{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:.5px solid var(--color-border-tertiary,#e5ddd5);padding:10px 0}.fr-msp:first-of-type{border-top:none;padding-top:0}
  .fr-msp b{font:400 20px var(--font-display)}.fr-rub{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}.fr-rub span{background:var(--color-background-secondary,#F6F1EC);border-radius:6px;padding:2px 7px}
  .fr-rub span.ko{background:#F7DADA;color:#8a1b1b}
  .fr-sc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.fr-sc div{background:var(--color-background-secondary,#F6F1EC);border-radius:8px;padding:7px 9px}.fr-sc small{display:block;font:700 9.5px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted)}.fr-sc b{font:400 18px var(--font-display)}
  a.fr-lien{color:var(--color-primary,#8D1D2C);font-weight:600;font-size:12.5px}
  @media (max-width:520px){.fr-sc{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="fr" class="fr"><div class="fr-mu">Lecture de votre suivi…</div></div>
<script src="suivi.js"></script>
</body>
</html>
