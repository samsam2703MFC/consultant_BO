name: Sonde — étiquettes NL, essai à blanc de l'envoi à TF Buddy (lecture seule)

# Lance sur le serveur, dans le cockpit déployé, consultant/bin/envoi_etiquettes_nl.php SANS option d'écriture : le
# script lit les allergènes, les fournisseurs, leurs matières premières, les produits et les matières de l'API avec le
# compte admin du cockpit, et dit ce qu'il changerait — il n'écrit rien dans l'API (21/11/2026, PR #208). Le rapport
# détaillé reste sur le serveur, dans le dossier privé (/var/lib/consulant_bo/prive/etiquettes-nl/).
#
# Avant l'essai à blanc, consultant/tools/sonde_etiquettes_nl.php montre la forme réelle des réponses de l'API (le
# premier essai n'a reconnu aucun allergène de /allergens) : des GET, coordonnées masquées.
#
# Déclenchement : pousser un changement sur la sonde ou ce fichier dans la branche ci-dessous. Ne déploie rien.

on:
  push:
    branches: [claude/dreamy-pascal-cd6566]
    paths: ['consultant/tools/sonde_etiquettes_nl.php', '.github/workflows/sonde-etiquettes-nl.yml']
  workflow_dispatch:

concurrency:
  group: sonde-etiquettes-nl
  cancel-in-progress: true

env:
  SSH_HOST: "185.180.206.46"
  SSH_PORT: "22"
  SSH_USER: "root"
  SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15"
  TARGET_DIR: "/var/www/consulant_bo"

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrôler la syntaxe de la sonde
        run: php -l consultant/tools/sonde_etiquettes_nl.php

      - name: Installer sshpass
        timeout-minutes: 4
        run: |
          sudo timeout 90 apt-get update -qq || true
          sudo timeout 90 apt-get install -y -qq sshpass || {
            deb="$(mktemp -d)/sshpass.deb"
            curl -fsSL --retry 3 --max-time 60 \
              "http://archive.ubuntu.com/ubuntu/pool/universe/s/sshpass/sshpass_1.09-1_amd64.deb" -o "$deb"
            sudo dpkg -i "$deb"
          }
          sshpass -V | head -1

      - name: Forme des réponses de l'API (lecture seule)
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          sshpass -e ssh ${SSH_OPTS} -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "php -- '${TARGET_DIR}'" < consultant/tools/sonde_etiquettes_nl.php

      # Essai à blanc : la commande ne porte PAS l'option d'écriture. Sortie 1 (introuvables, noms en double) = un
      # constat à lire, pas un échec de la sonde ; sortie 2 (compte admin, plan, allergènes non reconnus) = échec.
      - name: Essai à blanc sur le serveur du cockpit
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          sshpass -e ssh ${SSH_OPTS} -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p /var/lib/consulant_bo/prive/etiquettes-nl && chmod 700 /var/lib/consulant_bo/prive/etiquettes-nl && \
             cd '${TARGET_DIR}' && git -C '${TARGET_DIR}' log -1 --format='code déployé : %h %s' 2>/dev/null; \
             timeout 600 php consultant/bin/envoi_etiquettes_nl.php \
               --rapport=/var/lib/consulant_bo/prive/etiquettes-nl/essai_\$(date +%Y%m%d_%H%M).json; \
             rc=\$?; echo \"sortie du script : \$rc\"; [ \$rc -le 1 ]"
