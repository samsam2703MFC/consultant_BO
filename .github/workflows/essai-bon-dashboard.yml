name: Essai — le bon du dashboard magasin contre l'ERP (écriture)

# Essai de bout en bout du bon des promotions du magasin (#50), par les routes en
# ligne du cockpit, relu dans l'ERP après chaque étape, ménage compris. Accord de
# Sam le 24/10/2026. Détail et garde-fous : en-tête de tools/essai_bon_dashboard.php.
#
# Il ÉCRIT dans l'ERP : il ne part que sur un changement de
# `essai-bon-dashboard.trigger`, dont le premier mot donne le mode :
#   essai      — brouillon, envoi en caisse, caisse, bascule, puis ménage
#   nettoyage  — le ménage seul d'une promotion d'essai restée

on:
  push:
    branches: [claude/admiring-archimedes-8cr84j]
    paths: ['essai-bon-dashboard.trigger']

concurrency:
  group: essai-bon-dashboard
  cancel-in-progress: false

env:
  SSH_HOST: "185.180.206.46"
  SSH_PORT: "22"
  SSH_USER: "root"
  SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15"
  TARGET_DIR: "/var/www/consulant_bo"

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mode et syntaxe
        id: mode
        run: |
          php -l tools/essai_bon_dashboard.php
          mode="$(head -1 essai-bon-dashboard.trigger | awk '{print $1}')"
          case "$mode" in essai|nettoyage) ;; *) echo "::error::mode inconnu « $mode » (essai ou nettoyage)"; exit 1 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode : $mode"

      - name: Installer sshpass
        timeout-minutes: 4
        run: |
          sudo timeout 90 apt-get update -qq || true
          sudo timeout 90 apt-get install -y -qq sshpass || {
            deb="$(mktemp -d)/sshpass.deb"
            curl -fsSL --retry 3 --max-time 60 \
              "http://archive.ubuntu.com/ubuntu/pool/universe/s/sshpass/sshpass_1.09-1_amd64.deb" -o "$deb"
            sudo dpkg -i "$deb"
          }
          sshpass -V | head -1

      - name: Essai depuis le serveur du cockpit
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          sshpass -e ssh ${SSH_OPTS} -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "php -- '${TARGET_DIR}' '${{ steps.mode.outputs.mode }}'" < tools/essai_bon_dashboard.php
