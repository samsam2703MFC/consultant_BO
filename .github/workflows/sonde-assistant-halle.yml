name: Sonde — assistant du dashboard magasin, appel réel (Halle) (lecture seule)

# L'assistant du dashboard magasin, appel réel à Claude avant sa mise en ligne : src/assistant_magasin.php et
# src/fidelite_profils.php sont déposés dans /tmp du serveur (pas dans le site), le script pose deux questions pour Halle.
#
# Déclenchement : pousser un changement sur le script ou ce fichier dans la branche ci-dessous.
# Ne déploie rien : le déploiement du cockpit reste dans deploy.yml.

on:
  push:
    branches: [claude/elegant-cray-9i8enx]
    paths: ['pilotage-reseau/tools/sonde_assistant_halle.php', 'pilotage-reseau/src/assistant_magasin.php', 'pilotage-reseau/src/anthropic.php', '.github/workflows/sonde-assistant-halle.yml']
  # Lancement à la main : `espace` enregistre l'identifiant d'espace de travail Anthropic (wrkspc_…, pas un secret) dans
  # erp_cles (anthropic_workspace_id, portail commun) avant les questions. Rien n'est écrit dans le code.
  workflow_dispatch:
    inputs:
      espace:
        description: "Identifiant d'espace de travail Anthropic (wrkspc_…), facultatif"
        required: false
        default: ""

concurrency:
  group: sonde-assistant-halle
  cancel-in-progress: true

env:
  SSH_HOST: "185.180.206.46"
  SSH_PORT: "22"
  SSH_USER: "root"
  SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15"
  TARGET_DIR: "/var/www/consulant_bo"

# Le portail Pilotage réseau vit dans pilotage-reseau/ (dépôt des quatre portails) :
# chaque commande s'exécute depuis ce dossier, comme avant depuis la racine.
defaults:
  run:
    working-directory: pilotage-reseau

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrôler la syntaxe du script
        run: php -l tools/sonde_assistant_halle.php

      - name: Installer sshpass
        timeout-minutes: 4
        run: |
          sudo timeout 90 apt-get update -qq || true
          sudo timeout 90 apt-get install -y -qq sshpass || {
            deb="$(mktemp -d)/sshpass.deb"
            curl -fsSL --retry 3 --max-time 60 \
              "http://archive.ubuntu.com/ubuntu/pool/universe/s/sshpass/sshpass_1.09-1_amd64.deb" -o "$deb"
            sudo dpkg -i "$deb"
          }
          sshpass -V | head -1

      - name: Déposer les deux fichiers dans /tmp du serveur
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          sshpass -e scp ${SSH_OPTS} -P "${SSH_PORT}" src/assistant_magasin.php "${SSH_USER}@${SSH_HOST}:/tmp/sonde_assistant_magasin.php"
          sshpass -e scp ${SSH_OPTS} -P "${SSH_PORT}" src/fidelite_profils.php "${SSH_USER}@${SSH_HOST}:/tmp/sonde_fidelite_profils.php"
          sshpass -e scp ${SSH_OPTS} -P "${SSH_PORT}" src/anthropic.php "${SSH_USER}@${SSH_HOST}:/tmp/sonde_anthropic.php"

      - name: Poser deux questions à l’assistant pour Halle
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          ESPACE: ${{ inputs.espace }}
        run: |
          # L'identifiant passe par l'environnement et n'est accepté qu'au format wrkspc_ (rien d'autre n'atteint le shell distant).
          if [ -n "${ESPACE}" ] && ! [[ "${ESPACE}" =~ ^wrkspc_[A-Za-z0-9]+$ ]]; then echo "espace refusé : format wrkspc_ attendu"; exit 1; fi
          sshpass -e ssh ${SSH_OPTS} -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "php -- '${TARGET_DIR}' '${ESPACE}'" < tools/sonde_assistant_halle.php || true
          sshpass -e ssh ${SSH_OPTS} -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "rm -f /tmp/sonde_assistant_magasin.php /tmp/sonde_fidelite_profils.php /tmp/sonde_anthropic.php"
