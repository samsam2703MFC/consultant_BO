name: Sonde — composition du cougnou dans le carnet du fournisseur (lecture seule)

# Sam, 18/11/2026 : « est-ce qu'on a accès à la recette du produit ? cougnou : farine, œuf, beurre… ». La recette magasin
# n'a qu'une pâte crue livrée par SLFood ; la sonde lit le carnet de recettes du fournisseur. Rien n'est écrit.
#
# Déclenchement : pousser un changement sur le script ou ce fichier dans la branche ci-dessous.
# Ne déploie rien : le déploiement du cockpit reste dans deploy.yml.

on:
  push:
    branches: [claude/beautiful-faraday-euankl]
    paths: ['pilotage-reseau/tools/sonde_recette_cougnou.php', '.github/workflows/sonde-recette-cougnou.yml']
  workflow_dispatch:

concurrency:
  group: sonde-recette-cougnou
  cancel-in-progress: true

env:
  SSH_HOST: "185.180.206.46"
  SSH_PORT: "22"
  SSH_USER: "root"
  SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15"
  TARGET_DIR: "/var/www/consulant_bo"

defaults:
  run:
    working-directory: pilotage-reseau

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrôler la syntaxe du script
        run: php -l tools/sonde_recette_cougnou.php

      - name: Installer sshpass
        timeout-minutes: 4
        run: |
          sudo timeout 90 apt-get update -qq || true
          sudo timeout 90 apt-get install -y -qq sshpass || {
            deb="$(mktemp -d)/sshpass.deb"
            curl -fsSL --retry 3 --max-time 60 \
              "http://archive.ubuntu.com/ubuntu/pool/universe/s/sshpass/sshpass_1.09-1_amd64.deb" -o "$deb"
            sudo dpkg -i "$deb"
          }
          sshpass -V | head -1

      - name: Lire la recette du cougnou chez le fournisseur
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          sshpass -e ssh ${SSH_OPTS} -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "php -- '${TARGET_DIR}'" < tools/sonde_recette_cougnou.php
