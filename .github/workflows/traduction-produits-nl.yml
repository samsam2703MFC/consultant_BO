name: Traduction — noms de l’ERP en néerlandais (flamand de Belgique)

# Sam, 18/11/2026 : « traduire tout le matériel en néerlandais (flamand de Belgique) » par les routes
# /{ressource}/{id}/aliases ; « ok pour écrire, fais le tout ».
# Les tables de pilotage-reseau/tools/traductions/ (produits, catégories de produits, groupes de catégories, matières
# premières, catégories de matières) sont déposées dans /tmp du serveur et appliquées par tools/traduire_produits_nl.php
# avec les identifiants du serveur (compte consultant, sinon compte admin ERP). Une table vide ne fait que lister ce
# qui reste à traduire. Un nom néerlandais déjà saisi dans l'ERP n'est jamais écrasé ; relancer n'écrit que ce qui manque.
#
# Déclenchement : pousser un changement de pilotage-reseau/traduction-nl.trigger dans la branche ci-dessous (comme
# deploy.trigger) — pousser les tables ou le script seuls n'écrit rien. Ne déploie rien : le déploiement reste dans deploy.yml.

on:
  push:
    branches: [claude/beautiful-faraday-euankl]
    paths: ['pilotage-reseau/traduction-nl.trigger']
  workflow_dispatch:

concurrency:
  group: traduction-produits-nl
  cancel-in-progress: false

env:
  SSH_HOST: "185.180.206.46"
  SSH_PORT: "22"
  SSH_USER: "root"
  SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15"
  TARGET_DIR: "/var/www/consulant_bo"

# Le portail Pilotage réseau vit dans pilotage-reseau/ (dépôt des quatre portails) :
# chaque commande s'exécute depuis ce dossier.
defaults:
  run:
    working-directory: pilotage-reseau

jobs:
  traduction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Contrôler la syntaxe du script et les tables
        run: |
          php -l tools/traduire_produits_nl.php
          # Chaque ligne : identifiant numérique, une tabulation, un nom non vide.
          for t in tools/traductions/*.tsv; do
            if grep -vnP '^\d+\t\S.*$' "$t"; then echo "lignes invalides ci-dessus dans $t"; exit 1; fi
            echo "$t : $(wc -l < "$t") lignes"
          done

      - name: Installer sshpass
        timeout-minutes: 4
        run: |
          sudo timeout 90 apt-get update -qq || true
          sudo timeout 90 apt-get install -y -qq sshpass || {
            deb="$(mktemp -d)/sshpass.deb"
            curl -fsSL --retry 3 --max-time 60 \
              "http://archive.ubuntu.com/ubuntu/pool/universe/s/sshpass/sshpass_1.09-1_amd64.deb" -o "$deb"
            sudo dpkg -i "$deb"
          }
          sshpass -V | head -1

      - name: Déposer les tables dans /tmp du serveur
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          sshpass -e ssh ${SSH_OPTS} -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "rm -rf /tmp/traductions_nl && mkdir -p /tmp/traductions_nl"
          sshpass -e scp ${SSH_OPTS} -P "${SSH_PORT}" tools/traductions/*.tsv "${SSH_USER}@${SSH_HOST}:/tmp/traductions_nl/"

      - name: Écrire les noms néerlandais dans l’ERP, puis relire
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
        run: |
          set +e
          sshpass -e ssh ${SSH_OPTS} -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "php -- '${TARGET_DIR}' /tmp/traductions_nl" < tools/traduire_produits_nl.php
          rc=$?
          sshpass -e ssh ${SSH_OPTS} -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "rm -rf /tmp/traductions_nl"
          exit $rc
