<p class="sous">App Cuisine, tablette en portrait · trois étapes (cuisson, structure, organoleptique), photos, oui / non, corrections · grilles par catégorie</p>
<div class="grille"><figure class=""><img src="01-fiche-bouton.jpg" alt=""><figcaption><b>01 · La fiche produit</b>Le bouton « Autocontrôle qualité » sous le nom, les trois étapes annoncées, les 7 derniers jours en pastilles.</figcaption></figure><figure class=""><img src="02-cuisson.jpg" alt=""><figcaption><b>02 · 1. Cuisson</b>Photo obligatoire à côté de la référence ; teintes en vignettes ; un écart ouvre sa correction sur place.</figcaption></figure><figure class=""><img src="03-structure.jpg" alt=""><figcaption><b>03 · 2. Structure</b>Volume dessiné contre la cible, « Retombé après cuisson » en oui / non, mie au toucher de très mou à dur.</figcaption></figure><figure class=""><img src="04-structure-suite.jpg" alt=""><figcaption><b>04 · 2. Structure (suite)</b>Épaisseur de la croûte en coupe, forme vue de dessus, poids avec sa plage de tolérance.</figcaption></figure><figure class=""><img src="05-organoleptique.jpg" alt=""><figcaption><b>05 · 3. Organoleptique</b>Odeur, goût, mie en bouche, « je le mettrais en vitrine » : un toucher par ligne.</figcaption></figure><figure class=""><img src="06-bilan.jpg" alt=""><figcaption><b>06 · Bilan avec écarts</b>Décision suggérée pour le lot, réglages de la prochaine fournée sans doublon, écarts, photos, suites.</figcaption></figure><figure class=""><img src="07-bilan-conforme.jpg" alt=""><figcaption><b>07 · Bilan conforme</b>Tout à la cible : « Le reste est conforme » à chaque étape, le lot part en vitrine.</figcaption></figure><figure class=""><img src="08-fiche-apres.jpg" alt=""><figcaption><b>08 · La fiche, après</b>L'état du jour remplace le bouton ; un défaut qui revient 3 fois en 7 jours est signalé.</figcaption></figure><figure class="large"><img src="09-parametrage.jpg" alt=""><figcaption><b>09 · Paramétrage réseau</b>Une grille par catégorie : critères par étape, photo obligatoire ou non, corrections, surcharges par produit.</figcaption></figure></div></body></html>
