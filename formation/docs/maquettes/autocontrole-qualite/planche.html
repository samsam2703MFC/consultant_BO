<div class="grille"><figure class=""><img src="01-fiche-bouton.jpg" alt=""><figcaption><span>01 · La fiche produit</span>Le bouton « Autocontrôle qualité » sous le nom, les quatre étapes annoncées, les 7 derniers jours en pastilles.</figcaption></figure><figure class=""><img src="02-cuisson.jpg" alt=""><figcaption><span>02 · 1. Cuisson</span>Photo obligatoire à côté de la référence ; teintes en vignettes ; un écart ouvre sa correction sur place.</figcaption></figure><figure class=""><img src="03-structure.jpg" alt=""><figcaption><span>03 · 2. Structure</span>Volume dessiné contre la cible, « Retombé après cuisson » en oui / non, mie au toucher de très mou à dur.</figcaption></figure><figure class=""><img src="04-structure-suite.jpg" alt=""><figcaption><span>04 · 2. Structure (suite)</span>Épaisseur de la croûte en coupe, forme vue de dessus, poids avec sa plage de tolérance.</figcaption></figure><figure class=""><img src="05-organoleptique.jpg" alt=""><figcaption><span>05 · 3. Organoleptique</span>Odeur, goût, mie en bouche, « je le mettrais en vitrine » : un toucher par ligne.</figcaption></figure><figure class=""><img src="06-presentation.jpg" alt=""><figcaption><span>06 · 4. Présentation</span>Semblable à la photo de référence (côte à côte) ; à sa place dans la vitrine, case du planogramme liserée de bordeaux.</figcaption></figure><figure class=""><img src="07-bilan.jpg" alt=""><figcaption><span>07 · Bilan avec écarts</span>Décision suggérée pour le lot, réglages de la prochaine fournée sans doublon, écarts, photos, suites.</figcaption></figure><figure class=""><img src="08-bilan-conforme.jpg" alt=""><figcaption><span>08 · Bilan conforme</span>Tout à la cible : « Le reste est conforme » à chaque étape, le lot part en vitrine.</figcaption></figure><figure class=""><img src="09-fiche-apres.jpg" alt=""><figcaption><span>09 · La fiche, après</span>L'état du jour remplace le bouton ; un défaut qui revient 3 fois en 7 jours est signalé.</figcaption></figure><figure class="large"><img src="10-parametrage.jpg" alt=""><figcaption><span>10 · Paramétrage réseau</span>Une grille par catégorie et des critères communs à tous les produits (photo de référence, planogramme) : photo obligatoire ou non, corrections, surcharges par produit.</figcaption></figure></div></body></html>
