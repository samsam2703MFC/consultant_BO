<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D — Au téléphone, dans l'App worker</title>
<link rel="stylesheet" href="/public/assets/ds/global.css"><link rel="stylesheet" href="fo.css">
<script src="donnees.js"></script><script src="coque.js"></script>
</head><body><script>
/* D — Au téléphone, un onglet « Formation » dans l'App worker (même connexion : identifiants du panel).
   1. Mes formations : le parcours de son poste, ce qui reste, ce qui est à revoir.
   2. Le quiz d'une SOP : trois questions tirées du document.
   3. Le résultat : quiz réussi, il reste à être vu faire. Mila R. (fictive), nouvelle en production. */
const D = FO.tel;
const sb = '<div class="sb"><span>9:41</span><span>●●● 4G ▮</span></div>';
const ap = ini => `<div class="ap"><img src="/public/assets/img/logo.png"><span class="sp"></span><i>${ini}</i></div>`;
const nav = on => `<div class="nav">${[['🗓', 'Horaire'], ['✓', 'Tâches'], ['🎓', 'Formation'], ['€', 'Primes'], ['☺', 'Profil']].map(n => `<span class="${n[1] === on ? 'on' : ''}"><b>${n[0]}</b>${n[1]}</span>`).join('')}</div>`;
const ICO = { va: ['va', '✓'], qz: ['qz', 'Q'], lu: ['lu', 'L'], no: ['no', '·'], rv: ['rv', '!'] };
const e1 = `${sb}${ap('MR')}<div class="cn"><h2>Ma formation</h2><div class="sous">Parcours ${esc(D.parcours)} · arrivée le 03/11</div>
  <div class="bloc"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${D.faits} / ${D.items.length} vus faire</b><span class="mu">${D.quiz} quiz réussis</span></div><div class="prog" style="margin-top:8px;height:8px"><i style="width:${Math.round(D.faits / D.items.length * 100)}%"></i></div></div>
  <div class="bloc" style="padding:4px 14px">${D.items.map(it => `<div class="li"><span class="c ${ICO[it.st][0]}">${ICO[it.st][1]}</span><div class="x">${esc(it.court)}<small>${esc(it.note)}</small></div><span class="fl">›</span></div>`).join('')}</div>
</div>${nav('Formation')}`;
const Q = D.quiz2, qq = Q.quiz[1];
const e2 = `${sb}${ap('MR')}<div class="cn"><div class="sous" style="margin:6px 0 2px">${esc(Q.court)} · quiz</div><h2>Question 2 / 3</h2>
  <div class="prog" style="margin:8px 0 18px;height:6px"><i class="pr" style="width:50%"></i></div>
  <div style="font:600 18px/1.35 var(--font-ui);margin-bottom:18px">${esc(qq.q)}</div>
  ${qq.choix.map((c, j) => `<span class="rep ${j === qq.ok ? 'on' : ''}">${esc(c)}</span>`).join('')}
  <span class="gros">Valider</span><div class="mini" style="text-align:center;margin-top:10px">une erreur ? on relit l’étape et on recommence</div></div>${nav('Formation')}`;
const e3 = `${sb}${ap('MR')}<div class="cn" style="text-align:center"><div style="margin:40px auto 10px;width:86px;height:86px;border-radius:50%;background:#2d7a3e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:44px">✓</div>
  <h2>Quiz réussi · 3 / 3</h2><div class="sous">${esc(Q.court)}</div>
  <div class="bloc" style="text-align:left"><div class="lab">Il reste</div><div style="font-size:14px;line-height:1.45"><b>Être vue faire</b> par Elke V. (responsable) ou Sam V. (consultant), sur le poste. La SOP passe alors à ✓ dans ton parcours.</div></div>
  <span class="gros">Demander à être vue faire</span><span class="gros sec">SOP suivante : ${esc(D.suivante)}</span></div>${nav('Formation')}`;
const tel = (h, t, l) => `<div class="tel-w"><div class="tel"><div class="ecr">${h}</div></div><div class="leg2"><b>${t}</b>${l}</div></div>`;
document.body.innerHTML = `<div class="page"><div class="titre"><h1>Au téléphone, dans l’App worker</h1><span class="ss">un 3e onglet « Formation » · même connexion que l’horaire et les tâches · Mila R. (fictive), nouvelle en production à Halle</span></div>
  <div class="tels">${tel(e1, '1 · Ma formation', 'le parcours de son poste, dans l’ordre · ce qui reste · ce qui est à revoir après une nouvelle version')}${tel(e2, '2 · Le quiz', 'trois questions tirées de la SOP, relues par le consultant · gros boutons, une main')}${tel(e3, '3 · Réussi', 'le quiz ne suffit pas : la SOP est acquise quand quelqu’un l’a vue faire')}</div>
  <div class="pied">Maquette · SOP et questions réelles (Drive, 05/11/2026) · personne, progression et dates fictives · l’App worker existe (/consulant_bo/employee/) : l’onglet Formation y serait ajouté, ou /formation/ s’ouvrirait avec la même connexion.</div></div>`;
</script></body></html>
