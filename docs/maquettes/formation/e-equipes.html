<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E — Équipes</title>
<link rel="stylesheet" href="/public/assets/ds/global.css"><link rel="stylesheet" href="fo.css">
<script src="donnees.js"></script><script src="coque.js"></script>
</head><body><script>
/* E — Équipes : la matrice personnes × SOP du magasin. Quatre niveaux, du plus faible au plus fort :
   lu (toutes les étapes ouvertes) → quiz réussi → vu faire (validé sur le terrain par la responsable ou le consultant).
   Une nouvelle version d'une SOP repasse ses lecteurs en « à revoir ». Équipe et progression FICTIVES. */
const S = FO.sops, M = FO.halle.matrice;
const ICO = { va: ['va', '✓'], qz: ['qz', 'Q'], lu: ['lu', 'L'], no: ['no', '·'], rv: ['rv', '!'], na: ['na', ''] };
const ordre = ['01', '02', '03', '04'];
const cols = ordre.flatMap(d => S.filter(s => s.dossier === d));
const bande = `<tr><th></th>${ordre.map(d => { const n = S.filter(s => s.dossier === d).length; return `<th colspan="${n}" class="fam-h"><span class="fam ${FAM[d].c}" style="display:block">${d} · ${FAM[d].nom}</span></th>`; }).join('')}<th></th></tr>`;
const tete = `<tr><th style="text-align:left;vertical-align:bottom">Personne</th>${cols.map(s => `<th class="v"><div>${esc(s.mini || s.court)}${s.statut ? ' ⚠' : ''}</div></th>`).join('')}<th style="text-align:left;vertical-align:bottom">Vu faire</th></tr>`;
const lignes = EQUIPE.map(p => {
  const r = M[p.id];
  const concernes = cols.filter(s => r[s.id] !== 'na');
  const v = concernes.filter(s => r[s.id] === 'va').length;
  return `<tr><td class="p"><b>${esc(p.nom)}</b><small>${esc(p.role)} · ${p.langue} · depuis ${esc(p.depuis)}</small></td>
    ${cols.map(s => { const c = ICO[r[s.id]]; return `<td><span class="c ${c[0]}">${c[1]}</span></td>`; }).join('')}
    <td class="tot">${v} / ${concernes.length}<div class="prog" style="width:70px;margin-top:4px"><i style="width:${Math.round(v / concernes.length * 100)}%" class="${v / concernes.length < .5 ? 'att' : ''}"></i></div></td></tr>`;
}).join('');
const leg = `<div class="leg"><span><span class="c no">·</span>pas encore ouverte</span><span><span class="c lu">L</span>lue en entier</span><span><span class="c qz">Q</span>quiz réussi</span><span><span class="c va">✓</span>vu faire · validé sur le terrain</span><span><span class="c rv">!</span>à revoir · nouvelle version</span><span>case vide : pas son poste</span><span>⚠ SOP à valider : ouverte en lecture, sans quiz ni validation</span></div>`;
const matrice = `<div class="carte" style="margin-bottom:16px"><h3>Halle · qui sait faire quoi<small>chaque personne face aux SOP de son poste · le poste vient du panel (rôle), la case vide n’est pas attendue</small></h3>
  <div style="overflow-x:auto"><table class="mat">${bande}${tete}${lignes}</table></div>${leg}</div>`;
const AV = FO.halle.aValider;
const avalider = `<div class="carte"><h3>À valider sur le terrain<small>quiz réussi, pas encore vu faire · ${AV.length} validations</small></h3>
  ${AV.map(a => `<div class="fil"><div class="d">${esc(a.le)}</div><div class="x"><b>${esc(a.qui)}</b> · ${esc(a.sop)}<small>quiz ${esc(a.quiz)} · ${esc(a.note)}</small></div><span class="b s g">✓ Vu faire</span><span class="b s">Pas encore</span></div>`).join('')}
  <div class="mini" style="margin-top:10px">« Vu faire » se donne sur place : la responsable de Halle ou le consultant, à la visite production. Le geste compte, pas la lecture — c’est ce niveau qui alimente le point « Formation production et vente faite » du cadre de visite.</div></div>`;
const fil = `<div class="carte"><h3>Le fil<small>Halle · 7 derniers jours</small></h3>${FO.halle.fil.map(f => `<div class="fil"><div class="d">${esc(f.le)}</div><div class="x">${f.x}${f.s ? `<small>${esc(f.s)}</small>` : ''}</div></div>`).join('')}</div>`;
const reseau = `<div class="carte" style="margin-top:16px"><h3>Réseau<small>part des validations terrain attendues</small></h3>
  <div class="fil"><div class="x"><b>Halle</b><small>7 personnes · 25 SOP</small></div><b>${FO.halle.taux} %</b></div>
  <div class="fil"><div class="x"><b>Gosselies · Corbais · Sombreffe</b><small>les SOP viennent de Halle ; à déployer quand elles valent pour le réseau</small></div><span class="pill">pas encore ouvert</span></div></div>`;
const kpis = `<div class="kpis">
  <div class="kpi"><div class="k">Halle · vu faire</div><div class="v att">${FO.halle.taux} %</div><div class="s">${FO.halle.valides} sur ${FO.halle.attendues} attendues</div></div>
  <div class="kpi"><div class="k">À valider sur le terrain</div><div class="v">${AV.length}</div><div class="s">quiz réussi, geste pas encore vu</div></div>
  <div class="kpi"><div class="k">À revoir</div><div class="v ko">${FO.halle.aRevoir}</div><div class="s">nouvelle version publiée depuis leur lecture</div></div>
  <div class="kpi"><div class="k">Parcours en cours</div><div class="v">Mila R.</div><div class="s">Production · ${FO.halle.mila} · arrivée le 03/11</div></div></div>`;
coque('equipes', `<div class="titre"><h1>Équipes</h1><span class="ss">qui a lu, réussi le quiz, été vu faire · Halle · la connexion de chacun est celle de l’App worker</span></div>${kpis}${matrice}
  <div class="grille g2"><div>${avalider}</div><div>${fil}${reseau}</div></div>`, { boutons: ['Exporter (PDF)', 'Assigner un parcours'], prim: 1 });
</script></body></html>
