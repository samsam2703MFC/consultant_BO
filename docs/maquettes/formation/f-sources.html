<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F — Sources et versions</title>
<link rel="stylesheet" href="/public/assets/ds/global.css"><link rel="stylesheet" href="fo.css">
<script src="donnees.js"></script><script src="coque.js"></script>
</head><body><script>
/* F — Sources et versions : le Drive reste la source. Le module relit le dossier, réunit PDF et DOCX d'une même SOP,
   découpe le DOCX en sections et étapes, et publie après relecture. Une nouvelle version repasse ses lecteurs
   en « à revoir ». Les quiz sont proposés à partir du document et relus avant d'être posés. */
const S = FO.sops;
const etat = s => s.statut ? '<span class="pill att">À valider</span>'
  : s.revoir ? '<span class="pill ko">v' + esc(s.version) + ' publiée · lecteurs à revoir</span>'
  : !s.decoupe ? '<span class="pill">PDF seul · étapes à saisir</span>'
  : '<span class="pill ok">publiée</span>';
const lignes = S.map(s => `<tr class="${s.statut ? 'alerte' : s.revoir ? 'nouv' : ''}">
  <td><span class="fam ${FAM[s.dossier].c}">${s.dossier}</span></td>
  <td><b>${esc(s.court)}</b><small>${esc(s.titreDrive)}</small></td>
  <td>${langues(s.langue)}</td><td><span class="lg on">v${esc(s.version)}</span></td>
  <td>${s.fichiers.map(f => `<span class="pill">${f}</span>`).join(' ')}</td>
  <td>${s.nbEtapes || '—'}<small>${s.sections && s.sections.length ? s.sections.length + ' section' + (s.sections.length > 1 ? 's' : '') : ''}</small></td>
  <td>${s.quiz && s.quiz.length ? (s.statut ? '<span class="mu">—</span>' : s.quizRelu ? '<span class="ok">✓ relu</span>' : '<span class="att">à relire</span>') : '<span class="mu">—</span>'}</td>
  <td>${etat(s)}</td></tr>`).join('');
const table = `<div class="carte"><h3>Le dossier Drive<small>« L’Atelier Halle — SOP — dernières versions retrouvées » · 44 fichiers → ${S.length} SOP · relu chaque nuit et à la demande</small></h3>
  <table class="src"><thead><tr><th></th><th>SOP</th><th>Langue</th><th>Version</th><th>Fichiers</th><th>Étapes</th><th>Quiz</th><th>État</th></tr></thead><tbody>${lignes}</tbody></table></div>`;
const flux = `<div class="carte" style="margin-bottom:16px"><h3>Comment une SOP arrive ici</h3>
  <div class="etape-sync"><span class="n">1</span><div><b>On la dépose dans le Drive</b><small>Dans le bon dossier (01 à 04), nommée « type — sujet — langue — version », comme l’index du 05/11. Le Drive reste la seule source : on corrige le document, pas le module.</small></div></div>
  <div class="etape-sync"><span class="n">2</span><div><b>Le module relit le dossier</b><small>Chaque nuit, ou « Relire le Drive ». Un PDF et un DOCX du même nom font une seule SOP ; deux langues du même sujet aussi (Recuisson l’après-midi : FR + NL).</small></div></div>
  <div class="etape-sync"><span class="n">3</span><div><b>Il propose les étapes et le quiz</b><small>Le DOCX ou le Google Doc est découpé en sections et étapes, les points critiques (températures, temps, hygiène) repérés, trois questions proposées. Un PDF seul s’affiche tel quel, en attendant ses étapes.</small></div></div>
  <div class="etape-sync"><span class="n">4</span><div><b>Le consultant relit et publie</b><small>Étapes, points critiques et quiz relus en une page. La version précédente est archivée ; ceux qui l’avaient validée passent en « à revoir » — seulement si des étapes ont changé.</small></div></div>
  <div style="display:flex;gap:8px;margin-top:12px"><span class="b p">Relire le Drive</span><span class="b">Ouvrir le dossier ↗</span></div></div>`;
const Q = FO.quizExemple;
const quiz = `<div class="carte" style="margin-bottom:16px"><h3>Quiz à relire<small>${esc(Q.court)} · proposé à partir du document</small></h3>
  ${Q.quiz.map((q, i) => `<div class="question"><b>${i + 1}. ${esc(q.q)}</b><div class="opt">${q.choix.map((c, j) => `<span class="${j === q.ok ? 'rec' : ''}">${esc(c)}</span>`).join('')}</div></div>`).join('')}
  <div style="display:flex;gap:8px;align-items:center"><span class="b g">✓ Valider le quiz</span><span class="b">Modifier</span><span class="mini" style="margin-left:auto">la bonne réponse en rouge · réussite = 3 / 3</span></div></div>`;
const INC = FO.incoherences;
const incoh = `<div class="carte" style="margin-bottom:16px;border:1.5px solid #D97706"><h3>À trancher avant de publier<small>${INC.length} écarts repérés en lisant les SOP entre elles</small></h3>
  ${INC.map(i => `<div class="fil"><div class="x"><b>${esc(i.t)}</b><small>${esc(i.d)}</small></div><span class="pill ${i.c || 'att'}">${esc(i.qui)}</span></div>`).join('')}
  <div class="mini" style="margin-top:8px">Un écart se corrige dans le Drive. La SOP reste lisible, signalée en orange ; à la nouvelle version, ceux qui l’avaient validée repassent en « à revoir ».</div></div>`;
const hors = `<div class="carte"><h3>Hors de la collection<small>d’après l’index du 05/11</small></h3>
  <div class="mini" style="font-size:12px;line-height:1.6">
  <b>Non repris :</b> les manuels, carnets d’onboarding, prototypes, notes internes et brouillons v2 du manuel.<br>
  <b>Remplacé :</b> l’ancienne checklist après-midi / début de fermeture de mai, par Périodes calmes v2.0 et Fermeture v1.3.<br>
  <b>Non identifié comme SOP :</b> la procédure fournisseur d’encodage d’une réclamation — elle vit déjà dans le dashboard magasin (Réclamations).<br>
  <b>À valider :</b> Cuisson des baguettes et pains v1.0 — lisible par l’équipe, sans quiz ni validation tant qu’elle n’est pas validée.</div></div>`;
coque('sources', `<div class="titre"><h1>Sources et versions</h1><span class="ss">le Drive reste la source · le module relit, découpe en étapes, et publie après relecture</span></div>
  <div class="grille g2"><div>${table}</div><div>${incoh}${flux}${quiz}${hors}</div></div>`, { boutons: ['Relire le Drive', 'Ouvrir le dossier ↗'] });
</script></body></html>
