<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=1280">
<title>C — Pas à pas sur la tablette</title>
<link rel="stylesheet" href="/public/assets/ds/global.css"><link rel="stylesheet" href="fo.css">
<script src="donnees.js"></script><script src="coque.js"></script>
</head><body style="background:#F5F1EB"><script>
/* C — Le pas à pas, sur la tablette du poste (1280 × 800, paysage, cibles ≥ 48 px, lisible à un mètre) :
   une étape par écran, le plan de la SOP à gauche, le point critique en rouge, FR / NL d'un geste.
   Exemple : Ouverture du poste et premières cuissons — FR — v1.1, Karim A. (fictif) en cours. */
const P = FO.pasapas, s = P.sop;
let k = 0;
const plan = P.sections.map(sec => `<div class="s">${esc(sec.titre)}</div>${sec.etapes.map(e => { k++; const cls = k < P.courante ? 'fait' : k === P.courante ? 'on' : ''; return `<div class="e ${cls} ${e.crit ? 'crit' : ''}"><i>${k < P.courante ? '✓' : k}</i><span>${esc(e.court || e.fr)}</span></div>`; }).join('')}`).join('');
const E = P.etape;
document.body.innerHTML = `<div class="tab-app">
  <div class="tab-hd"><span class="ret">←</span><div class="t">${esc(s.court)}<small>${esc(s.type)} · ${esc(s.langue)} · v${esc(s.version)} · ${s.nbEtapes} étapes</small></div><span class="sp"></span>
    <span class="bascule"><span class="on">FR</span><span>NL*</span></span>
    <span class="moi"><i>KA</i>Karim A.</span></div>
  <div class="tab-corps"><div class="tab-plan">${plan}</div>
    <div class="tab-main"><div class="ou">Étape ${P.courante} / ${s.nbEtapes} · <span>${esc(E.section)}</span></div>
      <div class="txt" style="font:400 40px/1.1 var(--font-display)">${esc(E.fr)}</div>
      <div class="det" style="font-size:22px;line-height:1.45;color:#222">${esc(E.det)}</div>
      ${E.crit ? `<div class="tab-alerte"><span class="ic">⚠</span><div><b>Point critique</b>${esc(E.crit)}</div></div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px">
        <div class="carte" style="font-size:15px;line-height:1.5"><div class="lab">Repère · les deux fours</div>${P.reperes.map(r => `<div>• ${esc(r)}</div>`).join('')}</div>
        <div class="carte" style="font-size:15px;line-height:1.5"><div class="lab">J’appelle si</div>${esc(P.appelle)}<div class="lab" style="margin-top:10px">Une sonnerie ?</div>${esc(P.priorite)}</div>
      </div>
      <div style="flex:1"></div>
      <div class="mini" style="font-size:12.5px">* NL : traduction de travail, signalée comme telle tant qu’elle n’est pas relue · l’original PDF reste à un geste</div>
    </div></div>
  <div class="tab-pied"><span class="gb">← Précédente</span><div class="av"><div class="prog"><i class="pr" style="width:${Math.round((P.courante - 1) / s.nbEtapes * 100)}%"></i></div><small>${P.courante - 1} étapes faites · ${s.nbEtapes - P.courante + 1} restantes · tout doit être prêt à 6 h · reprise là où on s’est arrêté</small></div><span class="gb p">C’est fait · suivante →</span></div>
</div>`;
</script></body></html>
