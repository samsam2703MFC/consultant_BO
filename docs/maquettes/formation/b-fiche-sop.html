<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B — Fiche SOP</title>
<link rel="stylesheet" href="/public/assets/ds/global.css"><link rel="stylesheet" href="fo.css">
<script src="donnees.js"></script><script src="coque.js"></script>
</head><body><script>
/* B — La fiche d'une SOP : les étapes section par section (l'original, et sa traduction de travail quand
   le document est en néerlandais), les points critiques, l'original PDF à un clic, la version, l'équipe face
   à cette SOP, le quiz. Exemple : Ouverture du magasin — NL — v5, illustrée (photos de la caisse). */
const F = FO.fiche, s = F.sop;
const etapes = F.sections.map(sec => `<div class="sec"><b>${esc(sec.titre)}</b>${sec.titre_nl ? `<small>${esc(sec.titre_nl)}</small>` : ''}${sec.heure ? `<span class="pill">${esc(sec.heure)}</span>` : ''}</div>
  ${sec.etapes.map(e => `<div class="et ${e.crit ? 'crit' : ''}"><span class="n">${esc(e.n)}</span><div class="x">${esc(e.fr)}${e.nl ? `<small>NL · ${esc(e.nl)}</small>` : ''}</div>${e.photo ? `<img class="ph" src="${e.photo}">` : ''}</div>`).join('')}`).join('');
const eq = EQUIPE.filter(p => FO.halle.matrice[p.id][s.id] !== 'na');
const LIB = { va: ['ok', 'vu faire'], qz: ['att', 'quiz réussi'], lu: ['', 'lue'], no: ['', 'pas ouverte'], rv: ['ko', 'à revoir'] };
const equipe = `<div class="carte" style="margin-bottom:16px"><h3>Halle face à cette SOP<small>${eq.filter(p => FO.halle.matrice[p.id][s.id] === 'va').length} / ${eq.length} vus faire</small></h3>
  ${eq.map(p => { const st = FO.halle.matrice[p.id][s.id]; return `<div class="fil"><div class="x"><b>${esc(p.nom)}</b><small>${esc(p.role)} · lit en ${p.langue}</small></div><span class="pill ${LIB[st][0]}">${LIB[st][1]}</span></div>`; }).join('')}
  <div style="display:flex;gap:8px;margin-top:10px"><span class="b s">Rappeler aux 2 personnes</span><span class="b s g">✓ Vu faire…</span></div></div>`;
const infos = `<div class="carte" style="margin-bottom:16px"><h3>La SOP</h3><dl class="kv">
  <dt>Famille</dt><dd>${fam(s.dossier)}</dd><dt>Pour</dt><dd>${esc(F.pour)}</dd><dt>Moment</dt><dd>${esc(F.moment)}</dd>
  <dt>Langue</dt><dd>${langues(s.langue, 'NL')} original · FR traduction de travail</dd><dt>Version</dt><dd>v${esc(s.version)} · ${esc(F.versionNote)}</dd>
  <dt>Étapes</dt><dd>${s.nbEtapes} · ${F.sections.length} sections · 📷 ${s.photos} photos</dd><dt>Fichier</dt><dd><span class="lien">${esc(s.titreDrive)} ↗</span></dd></dl>
  <div class="pdf" style="margin-top:12px">${F.pages.map(p => `<img src="${p}">`).join('')}</div>
  <div class="mini" style="margin-top:6px">l’original, tel qu’il est dans le Drive — à un clic, plein écran</div></div>`;
const crit = `<div class="carte" style="margin-bottom:16px"><h3>Points critiques<small>repris en rouge dans le pas à pas</small></h3><div class="crit-box"><ul>${F.crit.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div></div>`;
const rem = F.remarques.length ? `<div class="carte" style="margin-bottom:16px;border:1.5px solid #D97706"><h3>Relevé à la lecture<small>à régler dans le document avant publication</small></h3>${F.remarques.map(r => `<div class="fil"><div class="x" style="font-size:12px">${esc(r)}</div></div>`).join('')}</div>` : '';
const quiz = `<div class="carte"><h3>Le quiz<small>3 questions · relu par le consultant</small></h3>${F.quiz.map((q, i) => `<div class="question"><b>${i + 1}. ${esc(q.q)}</b><div class="opt">${q.choix.map((c, j) => `<span class="${j === q.ok ? 'rec' : ''}">${esc(c)}</span>`).join('')}</div></div>`).join('')}</div>`;
const tete = `<div class="titre"><span class="lien">← Bibliothèque</span><h1>${esc(s.court)}</h1>${langues(s.langue, 'NL')}<span class="lg on">v${esc(s.version)}</span><span class="ss">${esc(F.objectif)}</span></div>`;
const barre = `<div class="filtres"><em>Afficher</em><span>NL · original</span><span class="on">FR · traduction de travail</span><span>Les deux</span><span class="sep">|</span><span>Les étapes</span><span>Le PDF</span><span style="margin-left:auto;background:#222;color:#fff;border-color:#222;font-weight:600">▶ Pas à pas sur la tablette</span></div>`;
coque('bib', `${tete}${barre}<div class="grille g2"><div class="carte etapes">${etapes}</div><div>${infos}${rem}${crit}${equipe}${quiz}</div></div>`, { boutons: ['Imprimer', 'Assigner…'], prim: 1 });
</script></body></html>
