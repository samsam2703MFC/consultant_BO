openapi: 3.0.3
info:
  title: TFBuddy — write endpoints requested by L'Atelier by (grocery resale)
  version: "2026-10-27"
  description: |
    Requested additions to the TFBuddy Swagger (`atelierby.tfbuddy.com/api/v1`), from L'Atelier by (CEO cockpit).

    The network resells **grocery items** bought as-is. The cockpit scans the supplier's PDF price list; a wizard
    encodes and validates each line, then creates it in TFBuddy as one chain:
    supplier → supplier catalogue item (SKU, EAN, pack, price) → material (allergens) → recipe (1 × the material)
    → sales product (category, max. price, availability periods, FR/NL).

    On 27/10/2026 these resources are **read-only** in the Swagger (GET only). Every operation below is **new**.
    Field names are the ones your GET endpoints already return; fields marked `x-nouveau: true` are new fields —
    tell us if you name them differently, the cockpit will follow.

    **The one endpoint the cockpit needs first: `POST /products/resale`** (atomic, all or nothing). The other
    operations allow corrections afterwards (price change, sales period, discontinued item).

    Common rules for every write:
    - admin realm (`POST /admin/auth/login`), `Authorization: Bearer <token>`;
    - `client_ref` on every POST: a second POST with the same `client_ref` creates nothing and returns the object
      already created with `200`;
    - `409` on a duplicate returns the **existing id** (`error.existing_id`), so the wizard reuses it;
    - `OPTIONS` on each path must list its methods in the `Allow` header (the cockpit's "Check API" button reads it,
      without writing anything);
    - `PATCH` is partial: only the fields sent change.
  contact:
    name: L'Atelier by — CEO cockpit
servers:
  - url: https://atelierby.tfbuddy.com/api/v1
security:
  - bearerAuth: []

tags:
  - name: Material suppliers
    description: MaterialController supplier — new write operations
  - name: Materials
    description: MaterialController — new write operations
  - name: Products
    description: ProductController — new write operations, including the atomic grocery resale endpoint
  - name: Product recipes
    description: ProductController recipe — new write operation
  - name: Product availability periods
    description: ProductController availability periods — new write operations

paths:
  /products/resale:
    post:
      tags: [Products]
      operationId: createGroceryResaleChain
      summary: Create a whole grocery resale chain in one atomic call (recommended)
      description: |
        Creates (or reuses) the supplier, creates the supplier catalogue item, its network-wide price, the material
        (or reuses an existing one, **left unchanged**), the item ↔ material mapping, the sales product and its recipe
        (`recipe_quantity` × the material). **All or nothing**: if any part is rejected, nothing is created.
        This is the endpoint the cockpit wizard calls, line by line.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResaleCreate' }
            example:
              client_ref: ep14-l7
              supplier: { id: 6 }
              catalog_product: { sku: CS-CHOC-72, name: Chocolat noir 72 % 100 g, ean: "5412345000075", package_size: 20, package_unit: pcs, vat_rate: 6 }
              price: { price_net: 34.00, valid_from: "2026-11-01" }
              material: { name: Chocolat noir 72 % 100 g, material_category_id: 11, unit_name: pcs, vat_rate: 6, allergens: [milk, soybeans], may_contain: [nuts] }
              units_per_pack: 20
              product:
                name: Chocolat noir 72 % - 100 g
                name_nl: Pure chocolade 72 % - 100 g
                id_category: 61
                max_sale_price: 3.20
                tax_value_percent: 6
                ean: "5412345000075"
                single_weight: 100
                ingredients_fr: "Pâte de cacao, sucre, beurre de cacao, lait entier en poudre, émulsifiant : lécithine de soja."
                ingredients_nl: "Cacaomassa, suiker, cacaoboter, volle melkpoeder, emulgator: sojalecithine."
                availability_period_ids: [1]
              recipe_quantity: 1
      responses:
        '201':
          description: Chain created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResaleCreated' }
        '200':
          description: Same `client_ref` already processed — the chain created the first time is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResaleCreated' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /material-suppliers:
    post:
      tags: [Material suppliers]
      operationId: createMaterialSupplier
      summary: Create a material supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '200': { $ref: '#/components/responses/Replayed' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/Invalid' }

  /material-suppliers/{id}:
    patch:
      tags: [Material suppliers]
      operationId: updateMaterialSupplier
      summary: Update a material supplier (partial)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierFields' }
      responses:
        '200': { $ref: '#/components/responses/Updated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /material-suppliers/{id}/catalog/products:
    post:
      tags: [Material suppliers]
      operationId: createSupplierCatalogProduct
      summary: Add an item to the supplier's catalogue
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogProductCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '200': { $ref: '#/components/responses/Replayed' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/Invalid' }

  /material-suppliers/{id}/catalog/products/{productId}:
    patch:
      tags: [Material suppliers]
      operationId: updateSupplierCatalogProduct
      summary: Update a supplier catalogue item (partial)
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/ProductId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogProductFields' }
      responses:
        '200': { $ref: '#/components/responses/Updated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /material-suppliers/{id}/price-lists:
    post:
      tags: [Material suppliers]
      operationId: createSupplierNetworkPrice
      summary: Set the dated pack price of a catalogue item — one price for the whole network
      description: |
        Decision of L'Atelier by: a supplier price list is written **once for all shops** (no per-shop list for
        grocery items). It then shows in every `/material-suppliers/{fid}/shops/{sid}/price-lists/current`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NetworkPriceCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '200': { $ref: '#/components/responses/Replayed' }
        '422': { $ref: '#/components/responses/Invalid' }

  /material-suppliers/{id}/catalog-mappings:
    post:
      tags: [Material suppliers]
      operationId: createCatalogMapping
      summary: Link a supplier catalogue item to a material
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogMappingCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '200': { $ref: '#/components/responses/Replayed' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/Invalid' }

  /materials:
    post:
      tags: [Materials]
      operationId: createMaterial
      summary: Create a material, with its allergens
      description: The products using this material inherit its allergens through their recipe, as today.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaterialCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '200': { $ref: '#/components/responses/Replayed' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/Invalid' }

  /materials/{id}:
    patch:
      tags: [Materials]
      operationId: updateMaterial
      summary: Update a material (partial)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaterialFields' }
      responses:
        '200': { $ref: '#/components/responses/Updated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /products:
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a sales product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '200': { $ref: '#/components/responses/Replayed' }
        '409': { $ref: '#/components/responses/Duplicate' }
        '422': { $ref: '#/components/responses/Invalid' }

  /products/{id}:
    patch:
      tags: [Products]
      operationId: updateProduct
      summary: Update a sales product (partial)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductFields' }
      responses:
        '200': { $ref: '#/components/responses/Updated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /products/{id}/recipe:
    put:
      tags: [Product recipes]
      operationId: replaceProductRecipe
      summary: Set (replace) the recipe of a product
      description: For a grocery item, one element — 1 × its material.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecipeReplace' }
      responses:
        '200': { $ref: '#/components/responses/Updated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  /product-availability-periods/{id}/products:
    post:
      tags: [Product availability periods]
      operationId: addProductToAvailabilityPeriod
      summary: Make a product available during a period (activation)
      description: Decision of L'Atelier by — a product is activated through its availability periods ("Permanent" for all year round).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: integer, example: 2210 }
      responses:
        '201': { description: "Product added to the period" }
        '200': { description: "Product was already in the period" }
        '404': { $ref: '#/components/responses/NotFound' }

  /product-availability-periods/{id}/products/{productId}:
    delete:
      tags: [Product availability periods]
      operationId: removeProductFromAvailabilityPeriod
      summary: Remove a product from a period
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/ProductId' } ]
      responses:
        '204': { description: "Removed" }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin realm token (`POST /admin/auth/login`).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: integer }

  responses:
    Created:
      description: Created — the full object, `id` included
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WithId' }
    Replayed:
      description: Same `client_ref` already processed — the object created the first time is returned
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WithId' }
    Updated:
      description: Updated — the full object
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WithId' }
    Duplicate:
      description: Duplicate (same `sku` at the same supplier, same `ean`, same `name` in the same category) — the existing id is returned
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: duplicate, message: "Un produit porte déjà ce code-barres.", field: product.ean, existing_id: 2104 } }
    Invalid:
      description: Validation error, naming the field
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: invalid, message: "La catégorie 99 n'existe pas.", field: product.id_category } }
    Unauthorized:
      description: Missing or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: This account may not write (e.g. consultant realm)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Unknown resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    WithId:
      type: object
      required: [id]
      properties:
        id: { type: integer }
      additionalProperties: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "Stable, machine-readable" }
            message: { type: string, description: "Human-readable, shown as is to the user" }
            field: { type: string, description: "The offending field, for validation errors" }
            existing_id: { type: integer, description: "On 409, the id of the existing object" }

    ClientRef:
      type: string
      maxLength: 64
      description: Idempotency key — a second POST with the same value creates nothing and returns the first object (`200`).
      example: ep14-l7

    AllergenCode:
      type: string
      description: Codes of `GET /allergens` (the 14 EU allergens).
      enum: [cereals_gluten, crustaceans, eggs, fish, peanuts, soybeans, milk, nuts, celery, mustard, sesame_seeds, sulphur_dioxide_sulphites, lupin, molluscs]

    SupplierFields:
      type: object
      properties:
        name: { type: string, example: Comptoir des Saveurs }
        type: { type: string, example: EXTERNAL }
        email: { type: string, format: email }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        country_code: { type: string, example: BE }
        tax_number: { type: string, example: BE0712345678 }
        website_url: { type: string }
        currency: { type: string, example: EUR }
        notes: { type: string }
    SupplierCreate:
      allOf:
        - $ref: '#/components/schemas/SupplierFields'
        - type: object
          required: [name]
          properties:
            client_ref: { $ref: '#/components/schemas/ClientRef' }

    CatalogProductFields:
      type: object
      properties:
        sku: { type: string, example: CS-CHOC-72 }
        name: { type: string }
        ean: { type: string, example: "5412345000075", description: "EAN-8 / EAN-13 / GTIN, check digit verified by the cockpit" }
        package_size: { type: number, description: "Units in the pack", example: 20 }
        package_unit: { type: string, example: pcs }
        portion_size: { type: number }
        portion_unit: { type: string }
        weight_grams: { type: integer }
        shelf_life_days: { type: integer }
        vat_rate: { type: number, description: "Purchase VAT (%)", example: 6 }
        is_active: { type: integer, enum: [0, 1] }
    CatalogProductCreate:
      allOf:
        - $ref: '#/components/schemas/CatalogProductFields'
        - type: object
          required: [name, package_size, package_unit]
          properties:
            client_ref: { $ref: '#/components/schemas/ClientRef' }

    NetworkPriceCreate:
      type: object
      required: [price_net, valid_from]
      properties:
        client_ref: { $ref: '#/components/schemas/ClientRef' }
        sku: { type: string, description: "Or `catalog_product_id`" }
        catalog_product_id: { type: integer }
        price_net: { type: number, description: "Pack price excl. VAT", example: 34.00 }
        package_size: { type: number }
        package_unit: { type: string }
        vat_rate: { type: number }
        valid_from: { type: string, format: date, example: "2026-11-01" }

    CatalogMappingCreate:
      type: object
      required: [material_id, catalog_product_id, units_per_pack]
      properties:
        client_ref: { $ref: '#/components/schemas/ClientRef' }
        material_id: { type: integer }
        catalog_product_id: { type: integer }
        units_per_pack: { type: number, example: 20 }

    MaterialFields:
      type: object
      properties:
        name: { type: string }
        code: { type: string }
        material_category_id: { type: integer, description: "Id from `GET /material-categories`" }
        unit_name: { type: string, enum: [pcs, g, kg, l], description: "Base unit" }
        vat_rate: { type: number }
        material_type: { type: string }
        waste_amount_perc: { type: number }
        allergens:
          type: array
          x-nouveau: true
          description: NEW — allergens the material CONTAINS
          items: { $ref: '#/components/schemas/AllergenCode' }
        may_contain:
          type: array
          x-nouveau: true
          description: NEW — possible traces ("may contain")
          items: { $ref: '#/components/schemas/AllergenCode' }
    MaterialCreate:
      allOf:
        - $ref: '#/components/schemas/MaterialFields'
        - type: object
          required: [name, material_category_id, unit_name]
          properties:
            client_ref: { $ref: '#/components/schemas/ClientRef' }

    ProductFields:
      type: object
      properties:
        name: { type: string, description: "French name" }
        name_nl: { type: string, x-nouveau: true, description: "NEW — Dutch name" }
        id_category: { type: integer, description: "Id from `GET /product-categories`" }
        max_sale_price:
          type: number
          x-nouveau: true
          description: NEW — maximum sales price incl. VAT, the same for every shop; a shop may sell below it, never above.
        tax_value_percent: { type: number, description: "Sales VAT (%), on the product, the same in every shop" }
        ean: { type: string, x-nouveau: true, description: "NEW on the product — barcode scanned at the till" }
        single_weight: { type: integer, description: "Grams" }
        is_divisible: { type: integer, enum: [0, 1] }
        portion_size: { type: number }
        ingredients_fr: { type: string, x-nouveau: true, description: "NEW — ingredient list in French" }
        ingredients_nl: { type: string, x-nouveau: true, description: "NEW — ingredient list in Dutch" }
        shelf_life_minutes: { type: integer }
        availability_period_ids:
          type: array
          x-nouveau: true
          description: NEW — ids from `GET /product-availability-periods`; the product is sold (active) during these periods.
          items: { type: integer }
    ProductCreate:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - type: object
          required: [name, id_category, max_sale_price, tax_value_percent, availability_period_ids]
          properties:
            client_ref: { $ref: '#/components/schemas/ClientRef' }

    RecipeReplace:
      type: object
      required: [elements]
      properties:
        yield_quantity: { type: number, default: 1 }
        elements:
          type: array
          items:
            type: object
            required: [material_id, required_quantity, unit_name]
            properties:
              material_id: { type: integer }
              required_quantity: { type: number, example: 1 }
              unit_name: { type: string, example: pcs }

    ResaleCreate:
      type: object
      required: [client_ref, supplier, catalog_product, price, material, units_per_pack, product, recipe_quantity]
      properties:
        client_ref: { $ref: '#/components/schemas/ClientRef' }
        supplier:
          description: An existing supplier (`id`) or the fields of a new one
          oneOf:
            - type: object
              required: [id]
              properties: { id: { type: integer } }
            - $ref: '#/components/schemas/SupplierFields'
        catalog_product: { $ref: '#/components/schemas/CatalogProductFields' }
        price:
          type: object
          required: [price_net, valid_from]
          description: Network-wide pack price (all shops)
          properties:
            price_net: { type: number }
            valid_from: { type: string, format: date }
        material:
          description: An existing material (`id` only — it is left unchanged) or the fields of a new one, allergens included
          oneOf:
            - type: object
              required: [id]
              properties: { id: { type: integer } }
            - $ref: '#/components/schemas/MaterialFields'
        units_per_pack: { type: number }
        product: { $ref: '#/components/schemas/ProductFields' }
        recipe_quantity: { type: number, default: 1 }
    ResaleCreated:
      type: object
      required: [supplier_id, catalog_product_id, material_id, product_id, recipe_id]
      properties:
        supplier_id: { type: integer }
        catalog_product_id: { type: integer }
        material_id: { type: integer }
        product_id: { type: integer }
        recipe_id: { type: integer }
