<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A — Dashboard magasin › Paramètres › Mails et automatisations</title>
<!-- Le rail du dashboard magasin gagne un groupe « Paramètres » : « Mails et automatisations ». Une page pour voir et
     régler ce qui part tout seul du magasin et vers lui : les rapports du réseau (quand, à qui, e-mail ou PDF joint), qui
     reçoit quoi, et les messages automatiques aux clients de la boîte mail du magasin. Rapports : ceux que le cockpit
     envoie aujourd'hui aux magasins (ceo_rapport, lu le 16/11/2026) ; deux propositions (dossier du mois, CA net). -->
<link rel="stylesheet" href="/public/assets/ds/global.css">
<link rel="stylesheet" href="/public/dashboard/dashboard.css">
<link rel="stylesheet" href="mails.css">
<script src="coque.js"></script>
</head><body><script>
const sw = (on, lock, txt) => `<span class="px-sw${on ? ' on' : ''}${lock ? ' lock' : ''}"><i></i>${txt || (lock ? '🔒 réseau' : (on ? 'reçu' : 'pas reçu'))}</span>`;
const P = { fr: 'Franchisé', mg: 'Manager', rs: 'Resp. vente', co: 'Comptable', di: 'Direction réseau' };
const chip = k => `<span class="px-chip">${P[k]}</span>`;
const RAP = [
  // [nom, ce qu'il contient, quand, formats, destinataires, actif, imposé, dernier envoi, sélectionné]
  ['Non-conformités du jour', 'les photos notées sous 4/5 la veille, le commentaire du contrôleur', 'chaque jour · 08:00', ['mail'], ['fr', 'mg'], true, false, 'aujourd’hui 08:00'],
  ['Non-conformités de la semaine', 'la semaine écoulée : écarts, photos non rendues, reprises', 'chaque lundi · 10:00', ['mail', 'pdf'], ['fr', 'mg'], true, false, 'aujourd’hui 10:00', true],
  ['Contrôle qualité non réalisé', 'part seulement si aucune photo n’est rendue à 19:00', 'chaque jour · 19:00', ['mail'], ['mg', 'rs'], true, true, 'jeudi 12/11 19:00'],
  ['Pointages suspects', 'les pointages incohérents de la journée', 'chaque jour · 21:00', ['mail'], ['fr'], true, false, 'hier 21:00'],
  ['Clôture Target de vente', 'le mois clos face au target, par vendeuse', 'le 3 du mois · 08:00', ['mail', 'pdf'], ['fr', 'di'], true, true, '03/11 08:00'],
  ['Affiche du mois', 'ce qu’il y a à gagner ce mois-ci, à imprimer', 'le 1er du mois · 08:00', ['pdf'], ['mg'], true, false, '01/11 08:00'],
  ['Scoring du trimestre', 'le classement et la fiche du magasin', 'début de trimestre · 08:00', ['pdf'], ['fr'], true, true, '01/10 08:00'],
  ['Dossier du mois', 'Résultat, P&L hors TVA, frais : le PDF du mois clos', 'le 2 du mois · 07:00', ['pdf'], ['fr', 'co'], false, false, 'jamais envoyé', false, 'proposé'],
  ['CA net du mois', 'le chiffre d’affaires hors TVA, ticket par ticket', 'le 1er du mois · 07:00', ['mail'], ['co'], false, false, 'jamais envoyé', false, 'proposé']
];
const fmt = f => f.map(x => x === 'pdf' ? '<span class="px-chip pdf">PDF joint</span>' : '<span class="px-chip mail">e-mail</span>').join('');
const lignes = RAP.map(r => `<tr class="${r[8] ? 'sel' : ''}"><td>${r[0]}${r[9] ? ' <span class="mq-neuf" style="margin-left:6px">' + r[9] + '</span>' : ''}<span class="sub">${r[1]}</span></td>
  <td>${r[2]}</td><td>${fmt(r[3])}</td><td>${r[4].map(chip).join('')}</td><td>${sw(r[5], r[6])}</td><td class="mu">${r[7]}</td><td><span class="px-ouvrir">Ouvrir ▸</span></td></tr>`).join('');
// Qui reçoit quoi : une personne par ligne, un rapport par colonne.
const PERS = [['fr', 'franchise.halle@exemple.be'], ['mg', 'manager.halle@exemple.be'], ['rs', 'vente.halle@exemple.be'], ['co', 'compta@exemple.be']];
const COLS = RAP.slice(0, 9);
const mx = `<table class="px-mx"><thead><tr><th>Personne</th>${COLS.map(r => `<th>${r[0].replace('Non-conformités', 'NC').replace('Contrôle qualité non réalisé', 'CQ non réalisé').replace('Clôture Target de vente', 'Target').replace('Scoring du trimestre', 'Scoring').replace('Affiche du mois', 'Affiche').replace('Pointages suspects', 'Pointages').replace('Dossier du mois', 'Dossier').replace('CA net du mois', 'CA net')}</th>`).join('')}</tr></thead>
  <tbody>${PERS.map(([k, m]) => `<tr><td>${P[k]}<span class="sub">${m}</span></td>${COLS.map(r => `<td>${r[4].includes(k) ? (r[5] ? '<span class="px-ok">✓</span>' : '<span class="px-ok" style="background:#c9c4bc">✓</span>') : '<span class="px-no"></span>'}</td>`).join('')}</tr>`).join('')}
  <tr><td><span class="px-chip ajout">+ ajouter une personne</span></td>${COLS.map(() => '<td></td>').join('')}</tr></tbody></table>`;
const regles = [
  ['Accusé de réception', 'Répond à chaque nouvel e-mail reçu, une fois par expéditeur sur 3 jours ; jamais aux envois automatiques ni aux « ne pas répondre ».', false, 'modèle « Accusé de réception » · 3 jours'],
  ['Relance d’une offre sans réponse', 'Relance une fois le client d’une offre en cours restée sans suite depuis 3 jours.', true, 'modèle « Relance » · 3 jours · 2 envoyés cette semaine'],
  ['Rappel la veille de la commande', 'Écrit au client d’une offre convertie en commande, la veille du jour prévu.', true, 'modèle « Rappel » · la veille · 1 envoyé hier']
].map(([n, t, on, m]) => `<div class="px-regle"><div><span class="t">${n}</span><span class="sub">${t}</span><span class="sub" style="color:var(--accent)">${m} ▸</span></div><div>${sw(on, false, on ? 'allumé' : 'éteint')}</div></div>`).join('');
const corps = `
  <p class="px-intro">Tout ce qui part tout seul, vers le magasin et depuis lui : les rapports du réseau (quand ils partent, à qui, en e-mail ou avec un PDF joint), et les messages automatiques aux clients de la boîte mail. Un rapport marqué <b style="font-weight:400">🔒 réseau</b> est imposé par le réseau : on choisit à qui il part, pas s’il part.</p>
  <div class="px-tabs"><button class="on">Rapports reçus<span class="n">9</span></button><button>Messages aux clients<span class="n">3</span></button><button>Destinataires<span class="n">4</span></button><button>Modèles<span class="n">6</span></button><button>Journal des envois</button></div>
  <div class="db-tuiles px-tuiles">
    <div class="db-tui"><div class="k">Envois automatiques</div><div class="v">9</div><div class="s">7 actifs · 2 proposés</div></div>
    <div class="db-tui"><div class="k">Avec un PDF joint</div><div class="v">5</div><div class="s">le nom du fichier et son contenu se règlent par rapport</div></div>
    <div class="db-tui"><div class="k">Destinataires</div><div class="v">4</div><div class="s">adresses du magasin · le consultant en copie</div></div>
    <div class="db-tui"><div class="k">Dernier envoi</div><div class="v">10:00</div><div class="s">Non-conformités de la semaine · 2 destinataires · envoyé</div></div>
  </div>
  <div class="db-card"><div class="ct"><span class="db-lab">Les rapports que reçoit le magasin</span><span class="db-mini">du réseau vers le magasin · cliquer une ligne pour la régler</span></div>
    <table class="px-t"><thead><tr><th>Rapport</th><th>Quand</th><th>Forme</th><th>À qui</th><th>Reçu</th><th>Dernier envoi</th><th></th></tr></thead><tbody>${lignes}</tbody></table></div>
  <div class="px-g2">
    <div class="db-card"><div class="ct"><span class="db-lab">Qui reçoit quoi</span><span class="db-mini">une case = la personne reçoit ce rapport · gris : rapport pas encore actif</span></div>${mx}</div>
    <div class="db-card"><div class="ct"><span class="db-lab">Messages automatiques aux clients</span><span class="db-mini">depuis la boîte mail du magasin</span></div>${regles}</div>
  </div>`;
coque({ titre: 'Mails et automatisations', corps,
  pied: 'Maquette du 16/11/2026 · les sept premiers rapports sont ceux que le cockpit envoie aujourd’hui aux magasins (Reporting automatisé) ; « Dossier du mois » et « CA net du mois » sont des propositions. Adresses d’exemple. Les trois messages aux clients sont ceux de la Boîte mail (accusé, relance, rappel).' });
</script></body></html>
