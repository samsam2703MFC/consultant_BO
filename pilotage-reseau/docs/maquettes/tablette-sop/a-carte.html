<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A · Une étape = une carte</title>
<!-- Maquette A (07/11/2026) — inspirée de SwipeGuide : UNE étape par écran, la photo en grand en haut (4:3), une action
     par ligne, la barre de progression en segments ; le sommaire des étapes s'ouvre dans un tiroir (« Toutes les
     étapes »), il ne prend jamais la place de l'étape. En paysage : la photo à gauche, le texte à droite. -->
<link rel="stylesheet" href="/public/formation/ds.css"><link rel="stylesheet" href="commun.css">
<style>
.a-prog{flex:0 0 auto;background:#fff;padding:12px 16px 12px;border-bottom:1px solid var(--line)}
.a-seg{display:flex;gap:3px}
.a-seg i{flex:1;height:8px;border-radius:2px;background:var(--chip)}
.a-seg i.f{background:var(--green)}
.a-seg i.on{background:var(--accent)}
.a-ou{display:flex;align-items:center;gap:12px;margin-top:10px}
.a-ou span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:15px}
.a-ou span b{font-weight:400;color:var(--accent)}
.a-liste{height:48px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:15px;flex:0 0 auto}
.a-zone{flex:1;min-height:0;overflow:auto;padding:16px}
.a-carte{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:980px;margin:0 auto}
.a-media{position:relative;background:#1c1a17;display:flex;justify-content:center}
/* Portrait : la photo garde 40 % de la hauteur, le texte reste visible sans défiler. */
.a-media .ph{border-radius:0;width:auto;height:min(40vh, calc((100vw - 34px) * 3 / 4));max-width:100%}
.a-dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:8px}
.a-dots button{width:44px;height:28px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.a-dots button::before{content:'';width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.55)}
.a-dots button.on::before{background:#fff}
.a-cpt{position:absolute;top:12px;right:12px;background:rgba(28,26,23,.7);color:#fff;font-size:13px;border-radius:6px;padding:4px 8px}
.a-txt{padding:20px 24px 24px}
.a-tete{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.a-num{min-width:56px;height:56px;border-radius:10px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;padding:0 8px}
.a-tete h1{margin:0;font-weight:400;font-size:32px;line-height:1.1}
.li{margin:0;padding:0;list-style:none}
.li li{position:relative;padding:10px 0 10px 34px;font-size:22px;line-height:1.35;border-top:1px solid var(--row-line)}
.li li:first-child{border-top:none}
.li li::before{content:'';position:absolute;left:6px;top:21px;width:12px;height:12px;border-radius:3px;background:var(--ink)}
.crit .li li::before{background:var(--danger)}
.a-ensuite{display:flex;align-items:center;gap:8px;width:100%;margin-top:16px;height:52px;border:none;border-top:1px solid var(--line);background:transparent;color:var(--muted);font-size:16px;text-align:left;padding:0}
.a-ensuite b{font-weight:400;color:var(--ink)}
.a-ensuite svg{margin-left:auto}
/* Le tiroir « Toutes les étapes » */
.feuille{position:absolute;z-index:21;left:0;right:0;bottom:0;max-height:78%;background:#fff;border-radius:12px 12px 0 0;display:flex;flex-direction:column}
.feuille-t{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.feuille-t b{font-weight:400;font-size:20px}.feuille-t small{color:var(--muted);font-size:14px;margin-left:8px}
.feuille-c{overflow:auto;padding:4px 12px 20px}
.feuille .s{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 8px 6px}
.feuille button.r{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;border:none;background:transparent;border-radius:10px;padding:4px 8px;text-align:left;font-size:17px;color:var(--ink)}
.feuille button.r i{width:40px;height:40px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:var(--muted-2)}
.feuille button.r.f{color:var(--muted)}.feuille button.r.f i{background:var(--green);border-color:var(--green);color:#fff}
.feuille button.r.on{background:#F6EDEE;color:var(--accent)}.feuille button.r.on i{background:var(--accent);border-color:var(--accent);color:#fff}
.feuille button.r .c{margin-left:auto;font-size:12px;color:var(--danger)}
/* Paysage : la photo à gauche, le texte à droite. */
@media (orientation:landscape) and (min-width:1000px){
  .a-carte{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);max-width:none;height:100%}
  .a-media{display:flex;align-items:center;background:#1c1a17}
  .a-media .ph{width:100%;height:auto}
  .a-txt{overflow:auto}
  .a-zone{display:flex}.a-carte{flex:1}
}
</style></head>
<body><div id="ec" class="ec"></div>
<script src="donnees.js"></script><script src="commun.js"></script>
<script>
const { D, E, S, esc, ICO, entete, pied, lignes, aide, brancher } = M;
function feuille() {
  let k = -1;
  return `<div class="voile" data-a="fermer"></div><aside class="feuille" role="dialog" aria-label="Toutes les étapes">
    <div class="feuille-t"><span><b>Toutes les étapes</b><small>${S.i} sur ${E.length} faites</small></span><button class="hd-ret" data-a="fermer" aria-label="Fermer">${ICO.fermer}</button></div>
    <div class="feuille-c"><div class="s">Avant de commencer</div>${D.infos.map(x => `<button class="r f"><i>${ICO.check}</i><span>${esc(x[0])}<br><small style="color:var(--muted);font-size:14px">${esc(x[1])}</small></span></button>`).join('')}
    ${D.sections.map(s => `<div class="s">${esc(s.titre)}</div>${s.etapes.map(e => { k++; return `<button class="r ${k < S.i ? 'f' : k === S.i ? 'on' : ''}" data-i="${k}"><i>${k < S.i ? ICO.check : esc(e.n)}</i>${esc(e.t)}${e.crit ? '<span class="c">critique</span>' : ''}</button>`; }).join('')}`).join('')}
    <div class="s">Pour finir</div><button class="r"><i>✓</i>Contrôle final · ${D.controle.length} points</button></div></aside>`;
}
function rendre() {
  const e = E[S.i], nxt = E[S.i + 1];
  const media = e.photos.length ? `<img class="ph" src="img/${e.photos[S.p] || e.photos[0]}" alt="">
      ${e.photos.length > 1 ? `<span class="a-cpt">Photo ${S.p + 1} / ${e.photos.length}</span><div class="a-dots">${e.photos.map((x, j) => `<button data-p="${j}" class="${j === S.p ? 'on' : ''}" aria-label="Photo ${j + 1}"></button>`).join('')}</div>` : ''}` : '';
  document.getElementById('ec').innerHTML = entete() + `
    <div class="a-prog"><div class="a-seg">${E.map((x, k) => `<i class="${k < S.i ? 'f' : k === S.i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="a-ou"><span><b>Étape ${S.i + 1}</b> sur ${E.length} · ${esc(e.section)}</span><button class="a-liste" data-a="feuille">${ICO.liste}Toutes les étapes</button></div></div>
    <main class="a-zone"><article class="a-carte">${media ? `<div class="a-media">${media}</div>` : ''}
      <div class="a-txt"><div class="a-tete"><span class="a-num">${esc(e.n)}</span><h1>${esc(e.t)}</h1></div>${lignes(e)}
        ${nxt ? `<button class="a-ensuite" data-a="suiv">Ensuite · <b>${esc(nxt.n)} ${esc(nxt.t)}</b>${ICO.droite}</button>` : ''}</div></article></main>
    ${pied()}${S.feuille ? feuille() : ''}${S.aide ? aide() : ''}`;
}
brancher(rendre);
</script></body></html>
