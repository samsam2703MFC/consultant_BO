<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Objectifs produits d'une campagne</title>
<!-- Trois écrans d'une même proposition : un objectif EN PIÈCES sur les produits d'une campagne,
     magasin par magasin, et la jauge qui dit où l'on en est.
       ?v=1  Cockpit › Campagne › Produits & objectifs : le multiselect des produits, l'objectif par magasin
       ?v=2  Dashboard magasin (vue Jour) : la jauge du magasin — variante A barre, variante B anneau, et au téléphone
       ?v=3  Cockpit › Campagne › Suivi : les quatre magasins face à leur objectif, le réseau, par produit
     Chiffres : ventes de septembre 2026 réelles pour les produits « pomme » de Sombreffe ; le reste est
     posé pour la maquette (octobre n'a pas commencé). -->
<link rel="stylesheet" href="../../../public/assets/ds/global.css">
<link rel="stylesheet" href="../../../public/dashboard/dashboard.css">
<style>
  body{background:var(--color-bg);margin:0;padding:18px 24px;font-family:var(--font-ui);color:var(--color-text);font-size:13px;line-height:1.45}
  #ecran{max-width:1300px;margin:0 auto}
  .prop{font:600 10px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-muted);margin:0 0 8px}
  .ok{color:#2d7a3e}.ko{color:#C0182B}.mu{color:var(--color-text-muted)}.att{color:#B26A00}
  .tab{font-variant-numeric:tabular-nums}
  /* --- le cockpit : cartes, entêtes, onglets ------------------------------- */
  .ck-hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .ck-hd .t{font-family:var(--font-display);font-size:24px;line-height:1.1}
  .ck-hd .s{font-size:12px;color:var(--color-text-muted)}
  .badge{font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:rgba(45,122,62,.12);color:#2d7a3e}
  .ck-tabs{display:flex;gap:4px;border-bottom:.5px solid var(--color-border-secondary);margin-bottom:14px}
  .ck-tabs span{padding:8px 12px;font-size:12.5px;color:var(--color-text-muted);border-bottom:2px solid transparent}
  .ck-tabs span.on{color:var(--color-text);font-weight:600;border-bottom-color:var(--color-primary)}
  .carte{background:var(--color-surface);border:.5px solid var(--color-border-tertiary);border-radius:12px;margin-bottom:12px}
  .carte>.ct{padding:11px 16px;border-bottom:.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .carte>.ct .db-mini{margin-left:auto}
  .corps{padding:14px 16px}
  .lab{font:600 10px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-muted);display:block;margin-bottom:5px}
  .inp{width:100%;box-sizing:border-box;border:.5px solid var(--color-border-secondary);background:var(--color-surface);color:var(--color-text);border-radius:8px;height:33px;padding:0 10px;font-family:var(--font-ui);font-size:12.5px}
  .btn{border:.5px solid var(--color-border-secondary);background:var(--color-surface);border-radius:999px;height:31px;padding:0 14px;font:500 12px var(--font-ui);color:var(--color-text);display:inline-flex;align-items:center;gap:6px}
  .btn.prim{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
  .puce{display:inline-flex;align-items:center;gap:6px;border-radius:999px;height:27px;padding:0 6px 0 11px;font-size:11.5px;font-weight:500;background:var(--color-primary);color:#fff}
  .puce i{font-style:normal;opacity:.7;font-size:11px;padding:0 4px}
  .puce.off{background:var(--color-background-secondary);color:var(--color-text)}
  /* le multiselect ouvert */
  .ms{position:relative}
  .ms .liste{position:absolute;left:0;right:0;top:36px;background:var(--color-surface);border:.5px solid var(--color-border-secondary);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.10);z-index:2;overflow:hidden}
  .ms .liste .grp{padding:7px 12px 3px;font:600 9.5px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-muted);background:var(--color-background-secondary)}
  .ms .liste .it{display:grid;grid-template-columns:22px 1fr 150px 110px;align-items:center;gap:8px;padding:6px 12px;font-size:12.5px;border-top:.5px solid var(--color-border-tertiary)}
  .ms .liste .it.on{background:#fdf4f5}
  .ms .liste .it .cb{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--color-border-secondary);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
  .ms .liste .it.on .cb{background:var(--color-primary);border-color:var(--color-primary)}
  .ms .liste .it .c{color:var(--color-text-muted);font-size:11px}
  .ms .liste .it .q{text-align:right;color:var(--color-text-muted);font-size:11px}
  .ms .pied{padding:7px 12px;font-size:11px;color:var(--color-text-muted);border-top:.5px solid var(--color-border-tertiary);display:flex;justify-content:space-between}
  .radio{display:inline-flex;gap:14px;font-size:12.5px;align-items:center}
  .radio b{display:inline-block;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--color-border-secondary);vertical-align:-2px;margin-right:5px;position:relative}
  .radio b.on{border-color:var(--color-primary)}.radio b.on:after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--color-primary)}
  /* tableau des objectifs */
  table.obj{width:100%;border-collapse:collapse}
  table.obj th{text-align:left;font:600 10px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted);padding:0 10px 8px}
  table.obj th.n,table.obj td.n{text-align:right}
  table.obj td{padding:9px 10px;border-top:.5px solid var(--color-border-tertiary);font-size:12.5px;vertical-align:middle}
  table.obj td.nom{font-weight:600}
  table.obj td .sub{display:block;font-size:10.5px;color:var(--color-text-muted);font-weight:400}
  table.obj tr.tot td{font-weight:600;background:var(--color-background-secondary)}
  .cible{width:96px;text-align:right;font-weight:600;font-size:14px;border:.5px solid var(--color-border-secondary);border-radius:8px;height:33px;padding:0 10px;font-family:var(--font-ui);background:var(--color-surface)}
  .cible.vide{font-weight:400;color:var(--color-text-muted)}
  .sugg{font-size:11px;color:var(--color-primary);white-space:nowrap}
  /* --- la jauge ----------------------------------------------------------- */
  .jg{position:relative;height:14px;border-radius:7px;background:var(--color-background-secondary);overflow:visible;margin:8px 0 4px}
  .jg i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--color-primary)}
  .jg i.ok{background:#2d7a3e}
  .jg b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--color-text)}
  .jg b:after{content:attr(data-l);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font:600 9.5px var(--font-ui);letter-spacing:.04em;white-space:nowrap;color:var(--color-text)}
  .jg.mini{height:8px;margin:4px 0 2px}.jg.mini b{top:-3px;bottom:-3px}.jg.mini b:after{display:none}
  .gros{font-family:var(--font-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
  .gros small{font-family:var(--font-ui);font-size:13px;color:var(--color-text-muted);font-weight:400}
  .pp{display:grid;grid-template-columns:minmax(0,1fr) 54px 64px;gap:4px 10px;align-items:center;font-size:12px;padding:5px 0;border-top:.5px solid var(--color-border-tertiary)}
  .pp:first-child{border-top:none}
  .pp .n{text-align:right;font-weight:600}.pp .q{text-align:right;color:var(--color-text-muted);font-size:11px}
  .pp .jg{grid-column:1/4;margin:0}
  .deux{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0}
  .deux>div{padding:14px 16px}.deux>div+div{border-left:.5px solid var(--color-border-tertiary)}
  .tuiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .tuiles4>div{background:var(--color-background-secondary);border-radius:10px;padding:9px 11px}
  .tuiles4 .k{font:600 9.5px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}
  .tuiles4 .v{font-family:var(--font-display);font-size:20px;line-height:1.15;margin-top:2px}
  .tuiles4 .s{font-size:10.5px;color:var(--color-text-muted)}
  .variante{display:inline-block;font:700 10px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--color-text);border-radius:999px;padding:3px 10px;margin-right:8px}
  /* le téléphone */
  .tel{width:390px;background:var(--color-bg);border:6px solid #222;border-radius:28px;padding:10px 0 0;overflow:hidden}
  .tel .mb-r{display:grid;grid-template-columns:1fr 1fr;border-bottom:.5px solid rgba(34,34,34,.14)}
  .tel .mb-r.un{grid-template-columns:1fr}
  .tel .mb-r>div{padding:9px 12px 8px;min-width:0}
  .tel .k{font:600 8.5px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}
  .tel .v{font-family:var(--font-display);font-size:24px;line-height:1.1;margin:2px 0}
  .tel .s{font-size:10px;color:var(--color-text-muted);line-height:1.3}
  .tel .dr{color:var(--color-primary);font-weight:600}
  /* suivi réseau */
  .mag{display:grid;grid-template-columns:170px minmax(0,1fr) 110px 120px 120px 110px;gap:14px;align-items:center;padding:11px 16px;border-top:.5px solid var(--color-border-tertiary);font-size:12.5px}
  .mag .nom{font-weight:600}.mag .nom small{display:block;font-weight:400;font-size:10.5px;color:var(--color-text-muted)}
  .mag .kv{font-size:11px;color:var(--color-text-muted)}.mag .kv b{display:block;font-size:14px;color:var(--color-text);font-variant-numeric:tabular-nums}
  .mag .etat{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-block}
  .mag .etat.ok{background:rgba(45,122,62,.12);color:#2d7a3e}.mag .etat.ko{background:rgba(192,24,43,.10);color:#C0182B}.mag .etat.att{background:rgba(178,106,0,.12);color:#B26A00}
  .ent{display:grid;grid-template-columns:170px minmax(0,1fr) 110px 120px 120px 110px;gap:14px;padding:8px 16px 4px;font:600 10px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px}
  .courbe{width:100%;height:150px;display:block}
</style>
</head>
<body>
<div id="ecran"></div>
<script>
const q = new URLSearchParams(location.search); const V = q.get('v') || '1';
const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const nf = n => Number(n).toLocaleString('fr-BE', { maximumFractionDigits: 0 });
const pct = (a, b) => b ? 100 * a / b : 0;
const fP = n => nf(Math.round(n)) + ' %';

// La campagne et ses chiffres au 19 octobre (jour 19 sur 31 ; 16 jours ouverts passés sur 27).
const CAMP = { nom: 'Tartes aux pommes', periode: '1 → 31 octobre 2026', jour: 19, jours: 31, ouverts: 16, ouvertsTot: 27, attendu: 100 * 16 / 27 };
const PRODUITS = [
  { nom: 'Pommes Tranches', cat: 'Tartes', sept: 118, on: true },
  { nom: 'Pommes Amandes', cat: 'Tartes', sept: 94, on: true },
  { nom: 'Pommes Crème', cat: 'Tartes', sept: 61, on: true },
  { nom: 'Pommes Tranches Ø 28 cm', cat: 'Tartes – Ø 28 cm', sept: 27, on: true },
  { nom: 'Pommes Amandes Ø 28 cm', cat: 'Tartes – Ø 28 cm', sept: 14, on: true },
  { nom: 'Gosette Pomme', cat: 'Viennoiserie Ind.', sept: 612, on: false },
  { nom: 'Mini - Pomme', cat: 'Viennoiserie réduction', sept: 540, on: false },
  { nom: 'Cake Pomme & Pralin - 300 g.', cat: 'Cake 100g.', sept: 41, on: false },
  { nom: 'Brie, Pommes & Miel', cat: 'Flip & Flap', sept: 92, on: false },
];
const MAGS = [
  { id: '2', nom: 'Corbais', n1: 742, sept: 198, objectif: 900, vendu: 623, auj: 31, rythme: 39 },
  { id: '3', nom: 'Gosselies', n1: 318, sept: 71, objectif: 400, vendu: 187, auj: 6, rythme: 12 },
  { id: '4', nom: 'Halle', n1: 276, sept: 64, objectif: 350, vendu: 296, auj: 14, rythme: 18 },
  { id: '5', nom: 'Sombreffe', n1: 401, sept: 88, objectif: 500, vendu: 214, auj: 9, rythme: 13 },
];
const SPLIT_SOMBREFFE = [['Pommes Tranches', 96], ['Pommes Amandes', 71], ['Pommes Crème', 31], ['Pommes Tranches Ø 28 cm', 10], ['Pommes Amandes Ø 28 cm', 6]];
const SPLIT_RESEAU = [['Pommes Tranches', 612], ['Pommes Amandes', 431], ['Pommes Crème', 219], ['Pommes Tranches Ø 28 cm', 41], ['Pommes Amandes Ø 28 cm', 17]];
const reste = m => Math.max(0, m.objectif - m.vendu);
const requis = m => reste(m) / (CAMP.ouvertsTot - CAMP.ouverts);
const projection = m => Math.round(m.vendu + m.rythme * (CAMP.ouvertsTot - CAMP.ouverts));
const etat = m => { const a = pct(m.vendu, m.objectif); return a >= CAMP.attendu ? ['ok', 'en avance'] : a >= CAMP.attendu - 8 ? ['att', 'dans les clous'] : ['ko', 'en retard']; };

function jauge(m, mini) {
  const a = Math.min(100, pct(m.vendu, m.objectif));
  return `<div class="jg${mini ? ' mini' : ''}"><i class="${a >= CAMP.attendu ? 'ok' : ''}" style="width:${a.toFixed(1)}%"></i><b style="left:${CAMP.attendu.toFixed(1)}%" data-l="attendu ${fP(CAMP.attendu)}"></b></div>`;
}

/* ---------- v1 : la campagne, ses produits, l'objectif par magasin ------------------------------- */
function ecranCampagne() {
  const sel = PRODUITS.filter(p => p.on);
  const parCat = {}; PRODUITS.forEach(p => { (parCat[p.cat] = parCat[p.cat] || []).push(p); });
  const totN1 = MAGS.reduce((a, m) => a + m.n1, 0), totObj = MAGS.reduce((a, m) => a + m.objectif, 0);
  return `
  <p class="prop">Cockpit › Marketing › Campagne</p>
  <div class="ck-hd"><div><div class="t">Tartes aux pommes — octobre 2026</div><div class="s">1 → 31 octobre · Réseau, 4 boutiques · type Produit saisonnier</div></div><span class="badge">En cours</span></div>
  <div class="ck-tabs"><span>Cadrage</span><span>Offre</span><span class="on">Produits &amp; objectifs</span><span>Communication</span><span>Mesure</span><span>Note franchisés</span></div>

  <div class="carte"><div class="ct"><span class="db-lab">Les produits de la campagne</span><span class="db-mini">tout ce qui est coché compte dans le même objectif · catalogue du panel, volumes de septembre sur le réseau</span></div>
    <div class="corps">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${sel.map(p => `<span class="puce">${esc(p.nom)}<i>✕</i></span>`).join('')}<span class="puce off">${sel.length} produits · ${nf(sel.reduce((a, p) => a + p.sept, 0))} vendus en sept.</span></div>
      <div class="ms"><input class="inp" value="pomme" style="border-color:var(--color-primary)">
        <div class="liste">
          ${Object.keys(parCat).map(c => `<div class="grp">${esc(c)}</div>${parCat[c].map(p => `<div class="it${p.on ? ' on' : ''}"><span class="cb">${p.on ? '✓' : ''}</span><span>${esc(p.nom)}</span><span class="c">${esc(p.cat)}</span><span class="q">${nf(p.sept)} en sept.</span></div>`).join('')}`).join('')}
          <div class="pied"><span>9 produits contiennent « pomme » · cocher pour ajouter</span><span>Entrée : fermer</span></div>
        </div>
      </div>
      <div style="height:480px"></div>
      <div style="display:flex;gap:26px;align-items:center;flex-wrap:wrap"><span class="lab" style="margin:0">Compter en</span><span class="radio"><span><b class="on"></b>pièces vendues</span><span><b></b>chiffre d’affaires (€)</span></span><span class="db-mini">· l’objectif et la jauge parlent la même unité</span></div>
    </div>
  </div>

  <div class="carte"><div class="ct"><span class="db-lab">L’objectif par magasin — ${esc(CAMP.periode)}</span><span class="db-mini">N-1 : les mêmes produits, même période un an plus tôt · un magasin sans objectif ne voit pas la jauge</span></div>
    <div class="corps" style="padding-top:8px">
      <table class="obj"><thead><tr><th>Magasin</th><th class="n">N-1 même période</th><th class="n">Septembre</th><th class="n">Objectif (pièces)</th><th class="n">Par jour ouvert</th><th class="n">Suggestion</th></tr></thead>
      <tbody>${MAGS.map(m => `<tr><td class="nom">${esc(m.nom)}<span class="sub">27 jours ouverts</span></td><td class="n tab">${nf(m.n1)}</td><td class="n tab mu">${nf(m.sept)}</td><td class="n"><input class="cible" value="${nf(m.objectif)}"></td><td class="n tab">${nf(Math.round(m.objectif / 27))}</td><td class="n"><span class="sugg">N-1 + 20 % = ${nf(Math.round(m.n1 * 1.2))}</span></td></tr>`).join('')}
      <tr class="tot"><td>Réseau</td><td class="n tab">${nf(totN1)}</td><td class="n tab mu">${nf(MAGS.reduce((a, m) => a + m.sept, 0))}</td><td class="n tab">${nf(totObj)}</td><td class="n tab">${nf(Math.round(totObj / 27))}</td><td class="n"><span class="sugg">${nf(Math.round(totN1 * 1.2))}</span></td></tr></tbody></table>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;align-items:center"><span class="db-mini" style="margin-right:auto">L’objectif se voit dans le dashboard du magasin dès l’enregistrement, et dans la note franchisés.</span><span class="btn">Appliquer la suggestion à tous</span><span class="btn prim">Enregistrer les objectifs</span></div>
    </div>
  </div>`;
}

/* ---------- v2 : le dashboard du magasin --------------------------------------------------------- */
function ecranDashboard() {
  const m = MAGS[3];
  const a = pct(m.vendu, m.objectif);
  const [cls, lib] = etat(m);
  const split = (L, tot) => L.map(([n, v]) => `<div class="pp"><span>${esc(n)}</span><span class="n tab">${nf(v)}</span><span class="q">${fP(pct(v, tot))}</span><div class="jg mini" style="margin:0"><i style="width:${pct(v, L[0][1]).toFixed(1)}%;background:#b8ad9f"></i></div></div>`).join('');
  const carteA = `
  <div class="db-card"><div class="ct"><span class="db-lab"><span class="variante">Variante A · barre</span>Objectif produits — ${esc(CAMP.nom)}</span><span class="db-mini">${esc(CAMP.periode)} · 5 produits · jour ${CAMP.jour} sur ${CAMP.jours} · le repère noir : où l’on devrait en être aujourd’hui</span></div>
    <div class="deux">
      <div>
        <div class="gros">${nf(m.vendu)} <small>/ ${nf(m.objectif)} tartes</small> <span class="${cls}" style="font-size:16px;font-family:var(--font-ui);font-weight:600;margin-left:6px">${fP(a)}</span></div>
        ${jauge(m)}
        <div class="db-mini" style="margin-top:10px"><b class="${cls}">${lib}</b> · attendu à ce jour ${fP(CAMP.attendu)} · <b>+${m.auj} aujourd’hui</b> · reste ${nf(reste(m))} sur ${CAMP.ouvertsTot - CAMP.ouverts} jours ouverts</div>
        <div class="tuiles4">
          <div><div class="k">Aujourd’hui</div><div class="v">+${m.auj}</div><div class="s">tartes vendues</div></div>
          <div><div class="k">Reste à vendre</div><div class="v">${nf(reste(m))}</div><div class="s">d’ici le 31</div></div>
          <div><div class="k">Il faut</div><div class="v ${cls}">${nf(Math.round(requis(m)))} / j</div><div class="s">rythme actuel ${m.rythme} / j</div></div>
          <div><div class="k">Projection</div><div class="v ${cls}">${nf(projection(m))}</div><div class="s">${fP(pct(projection(m), m.objectif))} de l’objectif</div></div>
        </div>
      </div>
      <div><span class="lab">Par produit — vendus depuis le 1er</span>${split(SPLIT_SOMBREFFE, m.vendu)}
        <div class="db-mini" style="margin-top:8px">N-1 même période : ${nf(m.n1)} tartes · le réseau est à ${fP(pct(MAGS.reduce((a, x) => a + x.vendu, 0), MAGS.reduce((a, x) => a + x.objectif, 0)))}</div></div>
    </div>
  </div>`;
  const r = 54, C = 2 * Math.PI * r, ang = t => (t / 100) * 2 * Math.PI - Math.PI / 2;
  const mx = 70 + (r + 9) * Math.cos(ang(CAMP.attendu)), my = 70 + (r + 9) * Math.sin(ang(CAMP.attendu));
  const carteB = `
  <div class="db-card"><div class="ct"><span class="db-lab"><span class="variante">Variante B · anneau</span>Objectif produits — ${esc(CAMP.nom)}</span><span class="db-mini">${esc(CAMP.periode)} · 5 produits · jour ${CAMP.jour} sur ${CAMP.jours}</span></div>
    <div style="display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr);gap:18px;padding:14px 16px;align-items:center">
      <svg width="150" height="150" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--color-background-secondary)" stroke-width="14"/>
        <circle cx="70" cy="70" r="${r}" fill="none" stroke="${cls === 'ok' ? '#2d7a3e' : '#8D1D2C'}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(C * a / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 70 70)"/>
        <line x1="${(70 + (r - 10) * Math.cos(ang(CAMP.attendu))).toFixed(1)}" y1="${(70 + (r - 10) * Math.sin(ang(CAMP.attendu))).toFixed(1)}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#222" stroke-width="2.5"/>
        <text x="70" y="66" text-anchor="middle" font-family="var(--font-display)" font-size="26" fill="#222">${fP(a)}</text>
        <text x="70" y="84" text-anchor="middle" font-family="var(--font-ui)" font-size="10" fill="#6b6259">${nf(m.vendu)} / ${nf(m.objectif)}</text>
      </svg>
      <div>
        <div class="gros" style="font-size:26px">${nf(m.vendu)} <small>tartes sur ${nf(m.objectif)}</small></div>
        <div class="db-mini" style="margin-top:4px"><b class="${cls}">${lib}</b> · le trait noir marque l’attendu à ce jour, ${fP(CAMP.attendu)}</div>
        <div class="tuiles4" style="grid-template-columns:repeat(2,1fr)">
          <div><div class="k">Aujourd’hui</div><div class="v">+${m.auj}</div><div class="s">rythme ${m.rythme} / jour</div></div>
          <div><div class="k">Il faut</div><div class="v ${cls}">${nf(Math.round(requis(m)))} / j</div><div class="s">sur ${CAMP.ouvertsTot - CAMP.ouverts} jours ouverts</div></div>
        </div>
      </div>
      <div><span class="lab">Par produit</span>${split(SPLIT_SOMBREFFE, m.vendu)}</div>
    </div>
  </div>`;
  const tel = `
  <div style="display:flex;gap:22px;align-items:flex-start;margin-top:4px">
    <div class="tel">
      <div class="mb-r un"><div><div class="k">Objectif — tartes aux pommes</div><div class="v">${nf(m.vendu)} <span style="font-size:14px;color:var(--color-text-muted)">/ ${nf(m.objectif)}</span> <span class="${cls}" style="font-size:16px;font-family:var(--font-ui);font-weight:600">${fP(a)}</span></div>
        ${jauge(m, true)}<div class="s"><b class="${cls}">${lib}</b> · attendu ${fP(CAMP.attendu)} · +${m.auj} aujourd’hui · il faut ${nf(Math.round(requis(m)))} / j <span class="dr">· détail ▾</span></div></div></div>
      <div class="mb-r"><div><div class="k">Commandes clients</div><div class="v">7</div><div class="s">2 à préparer</div></div><div><div class="k">Livraisons</div><div class="v">1</div><div class="s">ce matin</div></div></div>
    </div>
    <div style="max-width:520px;padding-top:6px"><span class="lab">Au téléphone</span><div style="font-size:12.5px">Une tuile du mur, sous la semaine : le chiffre, la jauge avec le repère de l’attendu, et le rythme qu’il faut tenir. Le détail par produit s’ouvre en tiroir, comme le stock.</div>
      <div class="db-mini" style="margin-top:10px">Quand l’objectif est atteint, la tuile passe en or comme l’objectif du jour — badge « Objectif atteint » et confettis, une fois.</div></div>
  </div>`;
  return `
  <p class="prop">Dashboard magasin · Atelier by Harmonie — Sombreffe · lundi 19 octobre 2026 · vue Jour, sous l’objectif du jour</p>
  ${carteA}${carteB}${tel}`;
}

/* ---------- v3 : le suivi réseau, dans le cockpit ------------------------------------------------- */
function ecranSuivi() {
  const totV = MAGS.reduce((a, m) => a + m.vendu, 0), totO = MAGS.reduce((a, m) => a + m.objectif, 0);
  const R = { vendu: totV, objectif: totO, auj: MAGS.reduce((a, m) => a + m.auj, 0), rythme: MAGS.reduce((a, m) => a + m.rythme, 0) };
  const [cls, lib] = etat(R);
  // La courbe : cumul réseau jour par jour, face à la droite de l'objectif.
  const cum = [0]; const parJour = [88, 74, 61, 0, 80, 80, 90, 84, 79, 70, 0, 85, 85, 100, 91, 77, 66, 0, 110];
  parJour.forEach(v => cum.push(cum[cum.length - 1] + v));
  const W = 560, H = 150, px = i => 34 + i * ((W - 44) / 31), py = v => H - 18 - (v / totO) * (H - 30);
  const ligne = cum.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  const courbe = `<svg class="courbe" viewBox="0 0 ${W} ${H}">
    <line x1="${px(0)}" y1="${py(0)}" x2="${px(31)}" y2="${py(totO)}" stroke="#222" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="${px(0)}" y1="${py(0)}" x2="${px(31)}" y2="${py(0)}" stroke="var(--color-border-secondary)" stroke-width="1"/>
    <polyline points="${ligne}" fill="none" stroke="#8D1D2C" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="${px(19)}" cy="${py(cum[19])}" r="4" fill="#8D1D2C"/>
    <text x="${px(31)}" y="${py(totO) - 6}" text-anchor="end" font-size="10" fill="#222">objectif ${nf(totO)}</text>
    <text x="${px(19) + 8}" y="${py(cum[19]) + 4}" font-size="11" font-weight="600" fill="#8D1D2C">${nf(cum[19])}</text>
    ${[1, 8, 15, 22, 29].map(d => `<text x="${px(d)}" y="${H - 4}" font-size="9.5" text-anchor="middle" fill="#6b6259">${d} oct.</text>`).join('')}
  </svg>`;
  return `
  <p class="prop">Cockpit › Marketing › Campagne › Suivi des objectifs produits</p>
  <div class="ck-hd"><div><div class="t">Tartes aux pommes — où en est le réseau</div><div class="s">jour ${CAMP.jour} sur ${CAMP.jours} · attendu à ce jour ${fP(CAMP.attendu)} · relu du panel, tickets de la veille inclus</div></div><span class="badge">En cours</span></div>
  <div class="db-tuiles" style="grid-template-columns:repeat(5,1fr)">
    <div class="db-tui ${cls === 'ok' ? 'bon' : 'vif'}"><div class="k">Réseau</div><div class="v">${nf(totV)} <span style="font-size:13px;color:var(--color-text-muted)">/ ${nf(totO)}</span></div><div class="s">${fP(pct(totV, totO))} · ${lib}</div></div>
    <div class="db-tui"><div class="k">Aujourd’hui</div><div class="v">+${R.auj}</div><div class="s">tartes sur le réseau</div></div>
    <div class="db-tui"><div class="k">Rythme</div><div class="v">${R.rythme} / j</div><div class="s">il faut ${nf(Math.round(requis(R)))} / j d’ici le 31</div></div>
    <div class="db-tui ${projection(R) >= totO ? 'bon' : 'vif'}"><div class="k">Projection</div><div class="v">${nf(projection(R))}</div><div class="s">${fP(pct(projection(R), totO))} de l’objectif au rythme actuel</div></div>
    <div class="db-tui vif"><div class="k">En retard</div><div class="v">${MAGS.filter(m => etat(m)[0] === 'ko').length}</div><div class="s">magasin${MAGS.filter(m => etat(m)[0] === 'ko').length > 1 ? 's' : ''} sous l’attendu</div></div>
  </div>
  <div class="carte"><div class="ct"><span class="db-lab">Magasin par magasin</span><span class="db-mini">barre : vendu sur objectif · repère : attendu à ce jour · projection au rythme des 7 derniers jours</span></div>
    <div class="ent"><span>Magasin</span><span>Jauge</span><span>Vendu</span><span>Aujourd’hui · rythme</span><span>Il faut · projection</span><span>État</span></div>
    ${MAGS.slice().sort((a, b) => pct(b.vendu, b.objectif) - pct(a.vendu, a.objectif)).map(m => { const [c, l] = etat(m); return `<div class="mag"><span class="nom">${esc(m.nom)}<small>objectif ${nf(m.objectif)} · N-1 ${nf(m.n1)}</small></span><div>${jauge(m, true)}</div><span class="kv"><b>${nf(m.vendu)}</b>${fP(pct(m.vendu, m.objectif))}</span><span class="kv"><b>+${m.auj}</b>${m.rythme} / jour</span><span class="kv"><b class="${c}">${nf(Math.round(requis(m)))} / j</b>projection ${nf(projection(m))}</span><span><span class="etat ${c}">${l}</span></span></div>`; }).join('')}
  </div>
  <div class="cols">
    <div class="carte"><div class="ct"><span class="db-lab">Par produit — réseau</span><span class="db-mini">vendus depuis le 1er</span></div><div class="corps" style="padding-top:8px">${SPLIT_RESEAU.map(([n, v]) => `<div class="pp"><span>${esc(n)}</span><span class="n tab">${nf(v)}</span><span class="q">${fP(pct(v, totV))}</span><div class="jg mini" style="margin:0"><i style="width:${pct(v, SPLIT_RESEAU[0][1]).toFixed(1)}%;background:#b8ad9f"></i></div></div>`).join('')}</div></div>
    <div class="carte"><div class="ct"><span class="db-lab">Le cumul, jour par jour</span><span class="db-mini">trait pointillé : la droite de l’objectif · un dimanche fermé fait un palier</span></div><div class="corps" style="padding:10px 12px 6px">${courbe}</div></div>
  </div>`;
}

document.getElementById('ecran').innerHTML = V === '2' ? ecranDashboard() : V === '3' ? ecranSuivi() : ecranCampagne();
</script>
</body>
</html>
