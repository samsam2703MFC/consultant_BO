:root{--rubis:#8D1D2C;--rubis-f:#6E1622;--abricot:#F2C9A0;--abricot-d:#F8E2CB;--beige:#EAE4DC;--creme:#F5EFE4;--encre:#1c1a17;--muet:#7a736a;--muet2:#5c5852;
  --pale:#B8B2A8;--ligne:#e6e0d8;--papier:#faf7f2;--chip:#EDE7DE;--vert:#3f7a52;--or:#B0792A}
*{box-sizing:border-box}
body{margin:0;min-width:1680px;background:var(--papier);color:var(--encre);font:400 13px/1.45 'Gotham',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
b,strong,h1,h2,h3,h4{font-weight:400}
button,input{font:inherit;color:inherit}
svg{display:block;width:100%;height:100%}

/* La planche */
.pl{padding:30px 48px 40px;max-width:1680px}
.pl-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muet)}
.pl h1{margin:6px 0 6px;font-size:26px;letter-spacing:-.01em}
.pl-sous{margin:0;max-width:1150px;color:var(--muet2);font-size:13.5px}
.pl-g{display:grid;grid-template-columns:540px 392px minmax(0,1fr);gap:44px;margin-top:22px;align-items:start}
.pl-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muet);margin:0 0 12px}

/* La barre de la maquette : les réglages et la simulation */
.ctl{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:18px;background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:10px 14px}
.ctl .grp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muet2)}
.ctl .grp>span:first-child{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muet)}
.ctl .sep{width:1px;align-self:stretch;background:var(--ligne)}
.seg2{display:inline-flex;background:var(--chip);border-radius:7px;padding:2px}
.seg2 button{border:none;background:transparent;padding:4px 11px;border-radius:5px;cursor:pointer;color:var(--muet2);font-size:12px}
.seg2 button.on{background:#fff;color:var(--rubis);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.num{display:inline-flex;align-items:center;gap:4px;background:var(--papier);border:1px solid var(--ligne);border-radius:6px;padding:2px 6px}
.num input{width:44px;border:none;background:transparent;text-align:right;color:var(--rubis);outline:none;font-size:12.5px}
.num input::-webkit-inner-spin-button{opacity:1}
.bt{border:1px solid var(--ligne);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--muet2)}
.bt:hover{border-color:var(--rubis);color:var(--rubis)}
.bt.p{background:var(--rubis);border-color:var(--rubis);color:#fff}
.bt.p:hover{background:var(--rubis-f);color:#fff}
.bt[disabled]{opacity:.4;cursor:default}
.ctl .etat{font-size:12px;color:var(--encre)}

/* ---- La carte imprimée (A6, 105 × 148 mm) ---------------------------------------------- */
.carte{width:540px;min-height:762px;background:var(--creme);border-radius:10px;padding:26px 26px 22px;position:relative;transform:rotate(-1.2deg);
  box-shadow:0 1px 2px rgba(60,30,20,.12),0 18px 40px rgba(60,30,20,.16);display:flex;flex-direction:column;color:var(--encre)}
.carte>*{flex:none}
.ca-h{display:flex;justify-content:space-between;align-items:flex-start}
.ca-h img{height:24px}
.ca-saison{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--rubis);text-align:right;line-height:1.5}
.ca-titre{display:flex;align-items:baseline;gap:12px;margin:12px 0 0}
.ca-titre b{font:400 76px/0.9 'Vank','Gotham';color:var(--rubis);letter-spacing:.01em}
.ca-titre i{font:400 30px/1 'Playwrite','Gotham';font-style:normal;color:var(--rubis);transform:translateY(-6px)}
.ca-acc{margin:8px 0 14px;font-size:12.5px;color:var(--muet2)}
.ca-acc em{font-style:normal;color:var(--rubis)}
.grille{display:grid;border:1.6px solid var(--rubis);border-radius:4px;overflow:hidden;background:#fff}
.case{position:relative;min-height:108px;padding:6px 5px 7px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:inset -1.2px -1.2px 0 var(--rubis)}
.case.fete{background:var(--abricot-d)}
.case .s{align-self:stretch;display:flex;justify-content:space-between;font-size:8.5px;color:var(--muet);letter-spacing:.02em;white-space:nowrap}
.case .s span:first-child{color:var(--rubis)}
.case .ill{width:36px;height:36px;margin:2px 0 2px}
.case .ti{font-size:10.5px;line-height:1.15;color:var(--encre)}
.case .so{font-size:8.5px;line-height:1.2;color:var(--muet);margin-top:2px}
.case .tag{white-space:nowrap;margin-top:3px;font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--rubis);border:1px solid var(--rubis);border-radius:3px;padding:1px 4px}
.case .tag.pr{color:var(--rubis);background:transparent}
.case.bon{background:var(--rubis);color:#fff;box-shadow:inset -1.2px -1.2px 0 var(--rubis-f)}
.case.bon .s span,.case.bon .s span:first-child{color:var(--abricot)}
.case.bon .tag{background:var(--abricot);border-color:var(--abricot);color:var(--rubis)}
.case.bon .ill{width:44px;height:44px;margin:0}
.case.bon .ti{color:#fff}.case.bon .so{color:var(--abricot)}
.ca-pied{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:14px;margin-top:auto;padding-top:14px;align-items:end}
.ca-comment h4{margin:0 0 4px;font-size:11px;color:var(--rubis);letter-spacing:.04em;text-transform:uppercase}
.ca-comment p{margin:0;font-size:10.5px;line-height:1.45;color:var(--muet2)}
.ca-qr{text-align:center;font-size:8.5px;color:var(--muet);line-height:1.3}
.ca-qr .q{width:96px;height:96px;background:#fff;border-radius:6px;padding:4px;margin-bottom:4px}
.ca-qr .q svg path,.ca-qr .q svg rect{shape-rendering:crispEdges}

/* ---- L'app du client --------------------------------------------------------------------- */
.tel{width:392px;height:842px;border-radius:52px;background:#1c1a17;padding:12px;box-shadow:0 18px 40px rgba(60,30,20,.18)}
.ecran{width:100%;height:100%;border-radius:41px;background:#F4EFE8;overflow:hidden;position:relative;display:flex;flex-direction:column}
.st{display:flex;justify-content:space-between;padding:14px 28px 0;font-size:13px;color:var(--encre)}
.st i{font-style:normal;font-size:11px;letter-spacing:.04em}
.ap-h{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px}
.ap-h img{height:16px}
.ap-h span{font-size:12px;color:var(--muet2)}
.seg{display:flex;margin:2px 18px 10px;background:#E6DFD5;border-radius:8px;padding:2px}
.seg span{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:6px;color:var(--muet2)}
.seg span.on{background:#fff;color:var(--rubis)}
.ap{padding:0 18px 10px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow-y:auto}
.hero{display:flex;align-items:flex-end;justify-content:space-between}
.hero b{font:400 34px/0.95 'Vank','Gotham';color:var(--rubis)}
.hero b i{font:400 17px 'Playwrite','Gotham';font-style:normal;margin-left:4px}
.hero span{font-size:11px;color:var(--muet);text-align:right;line-height:1.35}
.hero span em{font-style:normal;font-size:20px;color:var(--encre);display:block}
.semaine{background:#fff;border-radius:14px;padding:11px 12px;display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;border:1.4px dashed var(--rubis)}
.semaine.faite{border-style:solid;border-color:var(--vert)}
.semaine .ill{width:46px;height:46px}
.semaine small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--rubis)}
.semaine.faite small{color:var(--vert)}
.semaine b{display:block;font-size:13.5px;margin-top:1px}
.jauge{height:7px;border-radius:4px;background:var(--chip);margin:7px 0 4px;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--rubis);border-radius:4px;transition:width .4s}
.semaine.faite .jauge i{background:var(--vert)}
.semaine p{margin:0;font-size:10.5px;color:var(--muet2);line-height:1.35}
.mini{display:grid;gap:6px}
.mc{position:relative;background:#fff;border-radius:10px;height:80px;padding:5px 4px 4px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.mc.clic{cursor:pointer}.mc.clic:hover{outline:1px solid var(--pale)}
.mc.fete{background:var(--abricot-d)}
.mc .ill{width:34px;height:34px;margin:9px 12px 0 0}
.mc .ti{font-size:8.4px;line-height:1.15;margin-top:3px;color:var(--encre)}
.mc .d{position:absolute;top:4px;left:6px;font-size:7.5px;color:var(--muet)}
.mc.futur{opacity:.42}
.mc.manquee .ill,.mc.manquee .ti{opacity:.28;filter:grayscale(1)}
.mc.manquee::after{content:'manquée';position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-12deg);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muet);border:1px solid var(--pale);border-radius:3px;padding:1px 4px;background:rgba(255,255,255,.8)}
.mc.encours{outline:1.6px dashed var(--rubis);outline-offset:-1.6px}
.mc .bar{position:absolute;left:8px;right:8px;bottom:6px;height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
.mc .bar i{display:block;height:100%;background:var(--rubis)}
.mc.neuf{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.tampon{position:absolute;right:3px;top:3px;width:30px;height:30px;border-radius:50%;border:2px solid var(--rubis);color:var(--rubis);transform:rotate(-14deg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.55);opacity:.92;line-height:1}
.tampon::before{content:'';position:absolute;inset:3px;border-radius:50%;border:1px solid var(--rubis)}
.tampon b{font-size:12px}
.tampon i{font-style:normal;font-size:5.5px;margin-top:1px}
.mc.bon{background:var(--rubis);color:#fff}
.mc.bon .d{color:var(--abricot)}
.mc.bon .ill{width:40px;height:40px;margin:8px 0 0}
.mc.bon .ti{color:#fff;font-size:11px;margin-top:0}
.mc.bon .bas{font-size:7.5px;color:var(--abricot);line-height:1.1}
.mc.bon.futur,.mc.bon.perdu,.mc.bon.proche{background:#E9DCDD;opacity:1}
.mc.bon.futur .ill,.mc.bon.perdu .ill{opacity:.45}
.mc.bon.futur .ti,.mc.bon.perdu .ti,.mc.bon.proche .ti{color:var(--rubis)}
.mc.bon.futur .bas,.mc.bon.futur .d,.mc.bon.perdu .bas,.mc.bon.perdu .d{color:var(--muet)}
.mc.bon.proche{outline:1.6px dashed var(--rubis);outline-offset:-1.6px}
.mc.bon.proche .bas,.mc.bon.proche .d{color:var(--rubis)}
.mc.bon.utilise .ill,.mc.bon.expire .ill{opacity:.55}
.tampon.blanc{border-color:#fff;color:#fff;background:rgba(141,29,44,.35)}.tampon.blanc::before{border-color:#fff}
.porte{background:#fff;border-radius:14px;padding:9px 12px;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
.porte.vide{grid-template-columns:minmax(0,1fr);color:var(--muet);font-size:11px;padding:12px}
.porte .ill{width:52px;height:52px}
.porte small{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--rubis)}
.porte b{display:block;font-size:12.5px}
.porte span{display:block;font-size:10px;color:var(--muet)}
.porte em{font-style:normal;font-size:11px;color:#fff;background:var(--rubis);border-radius:6px;padding:6px 10px}
.nav{display:flex;justify-content:space-around;padding:9px 0 20px;background:#fff;border-top:1px solid #EAE3D9;font-size:10px;color:var(--muet)}
.nav span.on{color:var(--rubis)}
.toast{position:absolute;top:8px;left:14px;right:14px;background:rgba(28,26,23,.94);color:#fff;border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;font-size:11px;line-height:1.35;cursor:pointer;animation:descend .35s ease}
.toast.bon{background:rgba(141,29,44,.97)}
.toast .ill{width:30px;height:30px;background:var(--creme);border-radius:8px;padding:2px}
.toast.bon .ill{background:var(--rubis);padding:0}
.toast small{display:block;font-size:9.5px;color:#cfc7bd;text-transform:uppercase;letter-spacing:.06em}
@keyframes descend{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}

/* ---- Les règles et l'année ------------------------------------------------------------- */
.reg{background:#fff;border:1px solid var(--ligne);border-radius:12px}
.reg>div{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--ligne)}
.reg>div:last-child{border-bottom:none}
.reg .ic{width:30px;height:30px;border-radius:8px;background:var(--rubis);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.reg b{display:block;font-size:13.5px}
.reg p{margin:2px 0 0;font-size:12px;color:var(--muet2)}
.reg .v{display:inline-block;color:var(--rubis);background:rgba(141,29,44,.07);border-radius:4px;padding:0 5px}
.schemas{display:flex;gap:16px;margin-top:9px}
.sch{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muet);line-height:1.3;border:1px solid transparent;border-radius:8px;padding:5px 7px;cursor:pointer;background:none}
.sch:hover{border-color:var(--ligne)}
.sch.on{color:var(--rubis);border-color:var(--rubis);background:rgba(141,29,44,.04)}
.sg{display:grid;gap:2px}
.sg i{width:9px;height:9px;border-radius:2px;background:#E6DFD5}
.sg i.b{background:#C99AA1}.sch.on .sg i.b{background:var(--rubis)}
.annee{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.sa{background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:12px 14px}
.sa.on{border-color:var(--rubis)}
.sa h4{margin:0;display:flex;justify-content:space-between;font-size:14px}
.sa h4 small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--rubis)}
.sa .dt{font-size:11px;color:var(--muet);margin:2px 0 7px}
.sa .ch{display:flex;flex-wrap:wrap;gap:4px}
.sa .ch span{font-size:10.5px;background:#F3EEE7;border-radius:4px;padding:2px 6px;color:var(--muet2)}
.sa.on .ch span{background:var(--abricot-d);color:var(--rubis-f)}
.note{margin:12px 0 0;font-size:11.5px;color:var(--muet);line-height:1.5}
.note em{font-style:normal;color:var(--rubis)}

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];

          if (_modules[row][col] != null) {
            continue;

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

                  || (r == 0 && c == 0) ) {

              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {

        } else {
          _modules[8][15 - i - 1] = mod;
        }

      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;

      var maxEcCount = 0;

const NS = SEMAINES.length;
const nf = (n, d) => Number(n).toLocaleString('fr-BE', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
const eur = v => nf(v, v % 1 ? 2 : 0) + ' €';
const ord = n => n === 1 ? '1re' : n + 'e';
const jour = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const dm = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const codeNeuf = () => 'FID' + Array.from({ length: 8 }, () => ALPHA[Math.floor(Math.random() * ALPHA.length)]).join('');

const depart = () => ({ x: REGLES.tousLes, seuil: REGLES.seuil, valeur: REGLES.bon.valeur, validite: REGLES.bon.validite,
  semaine: CLIENTE.semaine, depense: CLIENTE.depense, cochees: Object.assign({}, CLIENTE.cochees), utilises: Object.assign({}, CLIENTE.utilises),
  codes: Object.assign({}, CLIENTE.codes), neuf: null,
  toast: { ill: ILL.pain, txt: 'Ticket de 4,20 € enregistré. Encore 3,60 € cette semaine pour cocher « Le bon pain ».' } });
let S = depart();

/* --- Ce qui se déduit de l'état ------------------------------------------------------------- */
const lundi = n => jour(DEBUT, 7 * (n - 1));
const aujourdhui = () => jour(lundi(S.semaine), 3);                  // le jeudi de la semaine en cours
const nCoch = () => Object.keys(S.cochees).length;
const etatSemaine = n => S.cochees[n] ? 'coche' : (n === S.semaine ? 'encours' : (n > S.semaine ? 'futur' : 'manquee'));
const restantes = () => SEMAINES.filter(s => s.n >= S.semaine && !S.cochees[s.n]).length;
/** Les bons de la saison : le i-e se débloque à la (i·x)-e case cochée, le jour où elle l'a été. */
function bons(){
  const ordre = Object.keys(S.cochees).map(Number).sort((a, b) => a - b);
  const out = [], nb = Math.floor(NS / S.x);
  for (let i = 1; i <= nb; i++) {
    const k = i * S.x, b = bonDe(k), le = ordre.length >= k ? S.cochees[ordre[k - 1]] : null;
    const o = { i, k, nom: b.nom, motif: b.motif, le };
    if (le) {
      o.des = jour(le, 1); o.fin = jour(le, S.validite);
      o.etat = S.utilises[i] ? 'utilise' : (o.fin < aujourdhui() ? 'expire' : 'pris');
      o.code = S.codes[i] || (S.codes[i] = codeNeuf());
    } else { o.etat = nCoch() + restantes() >= k ? 'futur' : 'perdu'; }
    out.push(o);
  }
  const proche = out.find(o => o.etat === 'futur');
  if (proche) { proche.etat = 'proche'; }
  return out;
}
/** La grille : x semaines, puis le bon qui ferme la ligne (une ligne incomplète n'a pas de bon). */
function cellules(){
  const B = bons(), out = [];
  SEMAINES.forEach((s, i) => { out.push({ t: 's', s }); if ((i + 1) % S.x === 0) { out.push({ t: 'b', b: B[(i + 1) / S.x - 1] }); } });
  return out;
}

/* --- Les gestes ----------------------------------------------------------------------------- */
function ticket(m){
  if (S.semaine > NS) { return; }
  const avant = nCoch(), sem = SEMAINES[S.semaine - 1];
  S.depense = Math.round((S.depense + m) * 100) / 100;
  S.neuf = null;
  if (!S.cochees[S.semaine] && S.depense >= S.seuil) {
    S.cochees[S.semaine] = aujourdhui(); S.neuf = 's' + S.semaine;
    const n = avant + 1;
    if (n % S.x === 0 && n / S.x <= Math.floor(NS / S.x)) {
      const b = bonDe(n); S.neuf += ' b' + n / S.x;
      S.toast = { bon: true, ill: BONS_ILL[b.motif], txt: 'Bon débloqué : ' + b.nom + ', ' + eur(S.valeur) + ' dans votre portefeuille, dès demain et pour ' + S.validite + ' jours.' };
    } else {
      const k = S.x - (n % S.x);
      S.toast = { ill: ILL[sem.ill], txt: 'Case cochée : ' + sem.titre + ' ✓ ' + (n / S.x < Math.floor(NS / S.x) || n % S.x ? 'Encore ' + k + ' case' + (k > 1 ? 's' : '') + ' pour le prochain bon.' : '') };
    }
  } else if (S.cochees[S.semaine]) {
    S.toast = { ill: ILL[sem.ill], txt: 'Ticket de ' + eur(m) + ' enregistré. La case de la semaine est déjà cochée : rendez-vous lundi.' };
  } else {
    S.toast = { ill: ILL[sem.ill], txt: 'Ticket de ' + eur(m) + ' enregistré. Encore ' + eur(S.seuil - S.depense) + ' cette semaine pour cocher « ' + sem.titre + ' ».' };
  }
  rendre();
}
function semaineSuivante(){
  if (S.semaine > NS) { return; }
  S.semaine++; S.depense = 0; S.neuf = null;
  S.toast = S.semaine > NS ? { ill: BONS_ILL.noeud, bon: true, txt: 'La carte d’hiver est terminée : la 13e semaine, le dernier bon se prend et la carte du printemps arrive.' } : null;
  rendre();
}
function basculer(n){
  if (n >= S.semaine) { return; }
  if (S.cochees[n]) { delete S.cochees[n]; } else { S.cochees[n] = jour(lundi(n), 3); }
  S.neuf = S.cochees[n] ? 's' + n : null; S.toast = null;
  rendre();
}
function regler(k, v){
  v = Number(v);
  if (k === 'x') { S.x = v; }
  if (k === 'seuil' && v >= 1) { S.seuil = v; }
  if (k === 'valeur' && v > 0) { S.valeur = v; }
  if (k === 'validite' && v >= 1) { S.validite = Math.round(v); }
  S.neuf = null;
  rendre();
}
const ACTIONS = { ticket: e => ticket(+e.dataset.m), suivante: semaineSuivante, reset: () => { S = depart(); rendre(); },
  semaine: e => basculer(+e.dataset.n), x: e => regler('x', e.dataset.v), toast: () => { S.toast = null; rendre(); } };
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && ACTIONS[el.dataset.a]) { ACTIONS[el.dataset.a](el); } });
document.addEventListener('change', e => { const el = e.target.closest('[data-r]'); if (el) { regler(el.dataset.r, el.value); } });

/* --- Le rendu ------------------------------------------------------------------------------- */
const qr = (() => { const q = qrcode(0, 'M'); q.addData('L’Atelier by — carte fidélité Hiver 2026-2027 (maquette)'); q.make(); return q.createSvgTag(3, 0); })();

function vueCarte(){
  const caseImp = c => {
    if (c.t === 'b') { const b = c.b;
      return `<div class="case bon"><div class="s"><span>Bon ${b.i}</span><span>${ord(b.k)} case</span></div><span class="tag">Débloqué</span>
        <div class="ill">${BONS_ILL[b.motif]}</div><div class="ti">${b.nom}</div><div class="so">${eur(S.valeur)} · ${S.validite} jours</div></div>`; }
    const s = c.s;
    return `<div class="case${s.fete ? ' fete' : ''}"><div class="s"><span>S${s.n}</span><span>${s.du} – ${s.au}</span></div>${s.fete ? `<span class="tag">Fête · ${s.jour}</span>` : '<span class="tag pr">À l’honneur</span>'}
      <div class="ill">${ILL[s.ill]}</div><div class="ti">${s.titre}</div>${s.sous !== 'produit de la semaine' ? `<div class="so">${s.sous}</div>` : ''}</div>`;
  };
  return `<div class="carte">
    <div class="ca-h"><img src="${LOGO}" alt="L’Atelier by"><div class="ca-saison">Carte fidélité<br>Hiver 2026 – 2027</div></div>
    <div class="ca-titre"><b>BINGO</b><i>d’hiver</i></div>
    <p class="ca-acc">Du 23/11 au 14/02 · <em>une case par semaine, et toutes les ${S.x} cases, un bon.</em></p>
    <div class="grille" style="grid-template-columns:repeat(${S.x + 1},1fr)">${cellules().map(caseImp).join('')}</div>
    <div class="ca-pied">
      <div class="ca-comment"><h4>Comment ça marche</h4><p>Chaque semaine où vous dépensez <b>${eur(S.seuil)} ou plus</b> chez nous, en une ou plusieurs fois, la case de la semaine se coche toute seule. Toutes les ${S.x} cases, un bon de ${eur(S.valeur)} se débloque dans l’app. Scannez ce QR une fois : votre bingo vit dans l’app. Ensuite, montrez l’app ou cette carte à la caisse.</p></div>
      <div class="ca-qr"><div class="q">${qr}</div>Activez votre carte<br>N° 4417 0823</div>
    </div>
  </div>`;
}

function vueApp(){
  const fini = S.semaine > NS, sem = SEMAINES[Math.min(S.semaine, NS) - 1], B = bons(), neufs = (S.neuf || '').split(' ');
  const fait = !fini && !!S.cochees[S.semaine];
  const pct = Math.min(100, 100 * S.depense / S.seuil);
  const caseApp = c => {
    if (c.t === 'b') { const b = c.b;
      const bas = { pris: 'jusqu’au ' + (b.fin && dm(b.fin)), utilise: 'utilisé le ' + (S.utilises[b.i] && dm(S.utilises[b.i])), expire: 'expiré le ' + (b.fin && dm(b.fin)),
        proche: 'encore ' + (b.k - nCoch()) + ' case' + (b.k - nCoch() > 1 ? 's' : ''), futur: 'à la ' + ord(b.k) + ' case', perdu: 'au printemps' }[b.etat];
      return `<div class="mc bon ${b.etat}${neufs.includes('b' + b.i) ? ' neuf' : ''}"><span class="d">${ord(b.k)} case</span><div class="ill">${BONS_ILL[b.motif]}</div><div class="ti">${eur(S.valeur)}</div><div class="bas">${bas}</div>
        ${b.le ? `<span class="tampon blanc"><b>✓</b><i>${dm(b.le)}</i></span>` : ''}</div>`; }
    const s = c.s, e = etatSemaine(s.n);
    return `<div class="mc ${e}${s.fete ? ' fete' : ''}${s.n < S.semaine ? ' clic' : ''}${neufs.includes('s' + s.n) ? ' neuf' : ''}" ${s.n < S.semaine ? `data-a="semaine" data-n="${s.n}" title="Cliquer : cochée ou manquée"` : ''}>
      <span class="d">${s.du}</span><div class="ill">${ILL[s.ill]}</div><div class="ti">${s.titre.replace(' · ', '<br>')}</div>
      ${e === 'coche' ? `<span class="tampon"><b>✓</b><i>${dm(S.cochees[s.n])}</i></span>` : ''}${e === 'encours' ? `<span class="bar"><i style="width:${pct.toFixed(0)}%"></i></span>` : ''}</div>`;
  };
  const poche = B.filter(b => b.etat === 'pris').pop();
  const nB = B.filter(b => b.le).length;
  const semaine = fini ? `<div class="semaine faite"><div class="ill">${BONS_ILL.noeud}</div><div><small>13e semaine · 15 – 21/02</small><b>La carte d’hiver est terminée</b><p>Le dernier bon se prend cette semaine ; la carte du printemps arrive lundi.</p></div></div>`
    : `<div class="semaine${fait ? ' faite' : ''}"><div class="ill">${ILL[sem.ill]}</div><div><small>${fait ? 'Case cochée ✓' : 'Cette semaine'} · ${sem.du} – ${sem.au}</small><b>${sem.titre}</b>
      <div class="jauge"><i style="width:${pct.toFixed(0)}%"></i></div>
      <p>${fait ? eur(S.depense) + ' cette semaine. Rendez-vous lundi pour la case suivante.' : nf(S.depense, 2) + ' € sur ' + eur(S.seuil) + ' — encore ' + nf(S.seuil - S.depense, 2) + ' € d’ici dimanche et la case se coche toute seule.'}</p></div></div>`;
  return `<div class="tel"><div class="ecran">
    <div class="st"><span>9:41</span><i>5G ▮▮▮</i></div>
    <div class="ap-h"><img src="${LOGO}" alt=""><span>Bonjour ${CLIENTE.prenom}</span></div>
    <div class="seg"><span class="on">Bingo</span><span>Points</span><span>Portefeuille</span></div>
    <div class="ap">
      <div class="hero"><b>BINGO<i>d’hiver</i></b><span><em>${nCoch()} / ${NS}</em>cases · ${nB} bon${nB > 1 ? 's' : ''} débloqué${nB > 1 ? 's' : ''}</span></div>
      ${semaine}
      <div class="mini" style="grid-template-columns:repeat(${S.x + 1},1fr)">${cellules().map(caseApp).join('')}</div>
      ${poche ? `<div class="porte"><div class="ill">${BONS_ILL[poche.motif]}</div><div><small>Dans votre portefeuille</small><b>${poche.nom} · ${eur(S.valeur)}</b>
        <span>code ${poche.code} · jusqu’au ${dm(poche.fin)}</span></div><em>Montrer</em></div>` : '<div class="porte vide">Aucun bon à utiliser pour l’instant : le prochain arrive avec la case qui le débloque.</div>'}
    </div>
    ${S.toast ? `<div class="toast${S.toast.bon ? ' bon' : ''}" data-a="toast" title="Fermer"><div class="ill">${S.toast.ill}</div><div><small>L’Atelier by · maintenant</small>${S.toast.txt}</div></div>` : ''}
    <div class="nav"><span>Accueil</span><span class="on">Fidélité</span><span>Commander</span><span>Profil</span></div>
  </div></div>`;
}

function vueRegles(){
  const nb = Math.floor(NS / S.x), ks = Array.from({ length: nb }, (_, i) => ord((i + 1) * S.x));
  const schema = x => { let h = ''; for (let i = 0; i < NS; i++) { h += '<i></i>'; if ((i + 1) % x === 0) { h += '<i class="b"></i>'; } }
    return `<button class="sch${x === S.x ? ' on' : ''}" data-a="x" data-v="${x}"><span class="sg" style="grid-template-columns:repeat(${x + 1},9px)">${h}</span><span>x = ${x}<br>${Math.floor(NS / x)} bons</span></button>`; };
  return `<div class="reg">
    <div><span class="ic">€</span><div><b>Une case par semaine</b><p>Dès <span class="v">${eur(S.seuil)}</span> d’achats dans la semaine, en une ou plusieurs fois : boutique, click & collect, livraison. Une case par semaine au plus.</p></div></div>
    <div><span class="ic">✓</span><div><b>Elle se coche toute seule</b><p>Le ticket est rattaché à la carte : l’app ou la carte QR scannée à la caisse. Rien à tamponner, rien à demander à la vendeuse.</p></div></div>
    <div><span class="ic">✦</span><div><b>Chaque semaine a son thème</b><p>Les fêtes de la saison, illustrées (Saint-Nicolas, Noël, Épiphanie, Chandeleur…) et, entre deux fêtes, le produit de la semaine mis en avant en vitrine et sur les réseaux.</p></div></div>
    <div><span class="ic">x</span><div><b>Toutes les <span class="v">${S.x}</span> cases, un bon illustré</b><p>${ks.length > 1 ? 'La ' + ks.slice(0, -1).join(', la ') + ' et la ' + ks[ks.length - 1] : 'La ' + ks[0]} case cochées débloquent chacune un bon de <span class="v">${eur(S.valeur)}</span>, valable <span class="v">${S.validite}</span> jours dès le lendemain. Sa case s’allume et le code arrive dans le portefeuille de l’app : un vrai bon du panel, créé comme celui du « déjà venu ». La grille suit x : x semaines par ligne, le bon au bout.</p>
      <div class="schemas">${[2, 3, 4].map(schema).join('')}</div></div></div>
    <div><span class="ic">13</span><div><b>La 13e semaine</b><p>Entre deux cartes : le dernier bon se prend, la carte de la saison suivante arrive. Quatre cartes font l’année.</p></div></div>
  </div>
  <h3 class="pl-t" style="margin-top:22px">Une carte par saison <em>· 12 semaines + la 13e semaine</em></h3>
  <div class="annee">${SAISONS.map(s => `<div class="sa${s.etat === 'en cours' ? ' on' : ''}"><h4>${s.nom}<small>${s.etat}</small></h4>
    <div class="dt">${s.du} → ${s.au} · relais ${s.cadeaux}</div><div class="ch">${s.fetes.map(f => `<span>${f}</span>`).join('')}</div></div>`).join('')}</div>
  <p class="note">Branché sur ce qui existe : la carte QR donnée en caisse (<em>Fidélité › En caisse</em>) devient la carte de la saison ; le « déjà venu » reçoit en plus son bon. Le seuil, x, la valeur des bons et le thème de chaque semaine sont des valeurs de départ.</p>`;
}

function vueBarre(){
  const fini = S.semaine > NS, sem = fini ? null : SEMAINES[S.semaine - 1];
  const num = (k, v, u, pas) => `<label class="num"><input type="number" min="1" step="${pas || 1}" value="${v}" data-r="${k}">${u}</label>`;
  return `<div class="ctl">
    <div class="grp"><span>Réglages</span>x <span class="seg2">${[2, 3, 4].map(x => `<button class="${x === S.x ? 'on' : ''}" data-a="x" data-v="${x}">${x}</button>`).join('')}</span></div>
    <div class="grp">seuil ${num('seuil', S.seuil, '€')}</div>
    <div class="grp">bon ${num('valeur', S.valeur, '€', 0.5)} ${num('validite', S.validite, 'jours')}</div>
    <span class="sep"></span>
    <div class="grp"><span>Simulation</span><span class="etat">${fini ? '13e semaine (15 – 21/02)' : 'Semaine ' + S.semaine + ' · ' + sem.du + ' – ' + sem.au + ' · ' + nf(S.depense, 2) + ' €'}</span></div>
    <div class="grp">${[2.8, 4.2, 7.5].map(m => `<button class="bt p" data-a="ticket" data-m="${m}"${fini ? ' disabled' : ''}>+ ticket ${eur(m)}</button>`).join('')}
      <button class="bt" data-a="suivante"${fini ? ' disabled' : ''}>Semaine suivante ›</button><button class="bt" data-a="reset">Revenir au 14 janvier</button></div>
  </div>`;
}

function rendre(){
  const fini = S.semaine > NS;
  document.getElementById('pl').innerHTML = `
    <div class="pl-k">Maquette interactive · Fidélité › Bingo de saison · 12/11/2026</div>
    <h1>Le bingo de saison : une carte qui se remplit toute seule</h1>
    <p class="pl-sous">Une carte par saison, une case par semaine : dès ${eur(S.seuil)} d’achats dans la semaine, la case se coche dans l’app, sans tampon. Chaque case porte une fête de la saison ou le produit de la semaine, et toutes les ${S.x} cases cochées, un bon illustré se débloque. Ajoutez des tickets, passez à la semaine suivante, cliquez une semaine passée, changez x.</p>
    ${vueBarre()}
    <div class="pl-g">
      <section><h3 class="pl-t">La carte imprimée <em>· donnée en caisse, A6</em></h3>${vueCarte()}</section>
      <section><h3 class="pl-t">L’app du client <em>· ${fini ? 'la 13e semaine' : new Date(aujourdhui() + 'T12:00:00').toLocaleDateString('fr-BE', { weekday: 'long', day: 'numeric', month: 'long' })}</em></h3>${vueApp()}</section>
      <section><h3 class="pl-t">Les règles <em>· réglables au cockpit</em></h3>${vueRegles()}</section>
    </div>`;
}
rendre();
</script>
</body>
</html>
