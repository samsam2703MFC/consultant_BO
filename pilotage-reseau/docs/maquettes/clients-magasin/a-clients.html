<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A — Dashboard magasin › Vendre › Clients</title>
<!-- Les clients reliés au magasin (le `profile` du client pour ce magasin, au panel) : particuliers et pros, ce qu'il faut
     pour les joindre (e-mail, téléphone, langue), leur fidélité, leurs achats, et pour un pro sa TVA, Peppol, le
     paiement différé et la remise. Les champs sont ceux de la fiche client du panel (/shops/{id}/clients/{id}), lus le
     16/11/2026 ; noms et chiffres d'exemple. -->
<link rel="stylesheet" href="/public/assets/ds/global.css">
<link rel="stylesheet" href="/public/dashboard/dashboard.css">
<link rel="stylesheet" href="../parametres-mails/mails.css">
<link rel="stylesheet" href="clients.css">
<script src="../parametres-mails/coque.js"></script>
</head><body><script>
RAIL[3][1].splice(4, 0, ['clients', 'Clients', 'personnes', 'nouveau']);
const ok = '<span class="cl-ok">✓</span>', non = '<span class="mu">—</span>';
const C = [
  // [nom, code, origine, type, segment, e-mail, tél, langue, fidélité/app/webshop, dernière visite, fréquence, CA 12 mois, tickets, pro (tva, peppol, différé, remise), statut]
  ['Camille Lambert', 'C-004821', 'webshop', 'Particulier', '', true, true, 'FR', ['fidélité', 'app'], 'aujourd’hui', 'chaque semaine', '612 €', 48, null, 'commande demain 08:30'],
  ['Café du Parc', 'P-000112', 'caisse', 'Pro', 'Horeca', true, true, 'FR', [], 'samedi 14/11', '3 fois par semaine', '13 920 €', 162, ['✓', '✓', '✓', '10 %'], 'commande demain 07:15'],
  ['Jan Claes', 'C-003310', 'caisse', 'Particulier', '', true, true, 'NL', ['fidélité'], 'jeudi 12/11', 'chaque semaine', '488 €', 39, null, 'commande demain 10:00'],
  ['Résidence Les Tilleuls', 'P-000118', 'cockpit', 'Pro', 'Collectivité', true, true, 'FR', [], 'mardi 10/11', 'chaque semaine', '9 840 €', 96, ['✓', '✓', '✓', '8 %'], ''],
  ['Marie Wouters', 'C-005092', 'app', 'Particulier', '', false, true, 'NL', ['app'], 'vendredi 13/11', 'deux fois par mois', '214 €', 17, null, 'pas d’e-mail · commande demain'],
  ['Crèche Les Petits Pas', 'P-000121', 'caisse', 'Pro', 'Collectivité', true, false, 'FR', [], 'lundi 16/11', 'chaque semaine', '4 210 €', 52, ['✓', '—', '✓', '—'], 'facture d’octobre à faire'],
  ['Bureau Notaire Exemple', 'P-000124', 'webshop', 'Pro', 'Entreprise', true, true, 'FR', ['webshop'], 'mercredi 11/11', 'deux fois par mois', '2 980 €', 24, ['✓', '✓', '—', '5 %'], ''],
  ['Thomas Peeters', 'C-002207', 'caisse', 'Particulier', '', false, false, '—', ['fidélité'], '22/09', 'perdu de vue', '96 €', 11, null, 'fiche à compléter'],
  ['Société Événements Exemple', 'P-000130', 'caisse', 'Pro', 'Entreprise', true, true, 'FR', [], '30/10', 'chaque mois', '1 760 €', 9, ['✕ invalide', '—', '—', '—'], 'TVA invalide : compté au comptoir']
];
const lignes = C.map(r => {
  const pro = r[3] === 'Pro';
  const p = r[13];
  return `<tr><td><span class="nom">${r[0]}</span><span class="sub">${r[1]} · venu par ${r[2]}</span></td>
    <td>${pro ? `<span class="cl-tag pro">Pro · ${r[4]}</span>` : '<span class="cl-tag">Particulier</span>'}</td>
    <td>${r[5] ? ok + ' e-mail' : '<span class="cl-ko">✕ e-mail</span>'}<span class="sub">${r[6] ? '✓ téléphone' : '✕ téléphone'} · ${r[7]}</span></td>
    <td>${r[8].length ? r[8].map(x => `<span class="cl-tag ok">${x}</span>`).join('') : non}</td>
    <td>${r[9]}<span class="sub">${r[10]}</span></td>
    <td class="n" style="text-align:right;white-space:nowrap">${r[11]}<span class="sub">${r[12]} tickets</span></td>
    <td>${pro && p ? `<span class="sub" style="margin:0">TVA ${p[0]} · Peppol ${p[1]}</span><span class="sub">différé ${p[2]} · remise ${p[3]}</span>` : non}</td>
    <td>${r[14] ? `<span class="sub" style="margin:0;color:${/à faire|invalide|compléter|pas d’e-mail/.test(r[14]) ? '#A32014' : 'var(--accent)'}">${r[14]}</span>` : ''}<span class="px-ouvrir" style="display:block;margin-top:3px">Ouvrir la fiche ▸</span></td></tr>`;
}).join('');
const corps = `
  <div class="px-top"><p class="px-intro">Les clients reliés au magasin, particuliers et pros : comment les joindre, leur fidélité, leurs achats et, pour un pro, sa TVA, Peppol, le paiement différé et sa remise. La fiche se lit et s’écrit au panel ; le dashboard ajoute ce que le magasin en voit (tickets, commandes, offres, envois).</p><span class="px-btn p">+ Nouveau client</span></div>
  <div class="px-tabs"><button class="on">Tous<span class="n">1 284</span></button><button>Particuliers<span class="n">1 236</span></button><button>Pros<span class="n">48</span></button><button>À compléter<span class="n">312</span></button><button>Doublons<span class="n">6</span></button></div>
  <div class="db-tuiles px-tuiles">
    <div class="db-tui"><div class="k">Clients du magasin</div><div class="v">1 284</div><div class="s">venus au moins une fois · 412 ces 30 derniers jours</div></div>
    <div class="db-tui"><div class="k">Clients pro</div><div class="v">48</div><div class="s">41 avec une TVA valide · 22 sur Peppol · 19 en paiement différé</div></div>
    <div class="db-tui"><div class="k">Joignables</div><div class="v">71 % · 64 %</div><div class="s">par e-mail · par SMS (téléphone au format international)</div></div>
    <div class="db-tui"><div class="k">Fiches à compléter</div><div class="v">312</div><div class="s">sans e-mail ni téléphone, ou profil incomplet au panel</div></div>
  </div>
  <div class="cl-filtres"><span class="px-in" style="min-width:300px">🔍 Nom, société, e-mail, téléphone, n° de TVA…</span><span class="seg"><button class="is-on">Tous</button><button>Venus ces 30 jours</button><button>Perdus de vue</button></span><span class="px-in">Segment pro ▾</span><span class="px-in">Langue ▾</span><span style="flex:1"></span><span class="px-in">Exporter ▾</span></div>
  <div class="db-card"><div class="ct"><span class="db-lab">Les clients</span><span class="db-mini">les plus actifs d’abord · une ligne ouvre la fiche</span></div>
    <table class="px-t cl-t"><thead><tr><th>Client</th><th>Type</th><th>Joindre</th><th>Fidélité · app · webshop</th><th>Dernière visite</th><th style="text-align:right">12 mois</th><th>Pro</th><th></th></tr></thead><tbody>${lignes}</tbody></table></div>`;
coque({ actif: 'clients', titre: 'Clients', corps,
  pied: 'Maquette du 16/11/2026 · noms, codes et chiffres d’exemple. Les champs viennent de la fiche client du panel (/shops/{id}/clients/{id} : blocs client et profile, lus le 16/11/2026) ; les achats des tickets, les commandes des commandes clients du panel. « Doublons » : les fiches fusionnées au panel (client.merged_into_id).' });
</script></body></html>
