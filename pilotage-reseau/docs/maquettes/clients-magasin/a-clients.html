<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A — Dashboard magasin › Vendre › Clients</title>
<!-- v2 du 16/11/2026 (« retravailler la vue du client, inspire-toi de la fidélité ; voir si le client a sa carte de
     fidélité et, dans la liste, quel est leur niveau de fidélité ») : les niveaux de fidélité de l'onglet Fidélité en
     tête (Fanbase … Découverte, avec la part qui a une carte), puis chaque client avec son niveau, sa carte et où il en
     est, comment le joindre, son rythme, ses achats et, pour un pro, ses conditions. Noms et chiffres d'exemple. -->
<link rel="stylesheet" href="/public/assets/ds/global.css">
<link rel="stylesheet" href="/public/dashboard/dashboard.css">
<link rel="stylesheet" href="../parametres-mails/mails.css">
<link rel="stylesheet" href="clients.css">
<script src="../parametres-mails/coque.js"></script>
<script src="clients.js"></script>
</head><body><script>
const ok = '<span class="cl-ok">✓</span>', non = '<span class="mu">—</span>';
// Les niveaux : [clé, clients, avec une carte].
const N = [['fanbase', 38, 35], ['fidele', 74, 66], ['hebdo', 162, 131], ['regulier', 248, 176], ['occasionnel', 316, 190], ['decouverte', 446, 198]];
const tot = N.reduce((a, x) => a + x[1], 0), avec = N.reduce((a, x) => a + x[2], 0);
// Une tuile = toujours les mêmes six lignes (nom, nombre, part, condition sur deux lignes, barre, carte) : même hauteur, lignes alignées.
const tuile = (pastille, nom, v, part, cond, pct, coulBarre, bas, cl) => `<div class="fd-tui cl-tui${cl ? ' ' + cl : ''}"><span class="fd-tn">${pastille}${nom}</span><b>${v}</b>
    <span class="l1">${part}</span><span class="l2">${cond}</span><div class="fd-bar"><i style="width:${pct}%;background:${coulBarre}"></i></div><span class="l1 cc">${bas}</span></div>`;
const tuiles = N.map(([k, n, c]) => tuile(`<i style="background:${NIV[k][1]}"></i>`, NIV[k][0], n, `${Math.round(100 * n / tot)} % des clients`, NIV[k][2], Math.round(100 * c / n), NIV[k][1], `${Math.round(100 * c / n)} % avec une carte`)).join('')
  + tuile('<i class="fdc-ic" style="background:#8D1D2C;width:16px;height:11px;border-radius:3px"></i>', 'Avec une carte', Math.round(100 * avec / tot) + ' %', `${avec} clients sur ${tot.toLocaleString('fr-FR')}`,
    `${tot - avec} sans carte, dont 42 chaque semaine`, Math.round(100 * avec / tot), 'var(--prize)', 'à proposer en caisse', 'carte');
// Lean (16/11/2026) : six colonnes. [nom, type, niveau, évolution, carte (null = pas de carte), dernier passage, rythme, 12 mois, à faire, à faire en rouge]
const C = [
  ['Camille Lambert', 'Particulier', 'fidele', null, ['vienno', 7], 'aujourd’hui 08:12', 'le samedi surtout', '612 €', 'commande demain 08:30'],
  ['Café du Parc', 'Pro · Horeca', 'fanbase', null, 'pro', 'lundi 16/11', 'du lundi au samedi', '13 920 €', 'commande demain 07:15'],
  ['Sophie Dubois', 'Particulier', 'fidele', ['up', 'octobre'], null, 'hier 17:40', 'le mardi et le vendredi', '344 €', 'lui proposer la carte'],
  ['Jan Claes', 'Particulier', 'hebdo', null, ['points', 128], 'jeudi 12/11', 'le jeudi', '488 €', 'commande demain 10:00'],
  ['Marie Wouters', 'Particulier', 'regulier', ['up', 'octobre'], ['vienno', 10], 'vendredi 13/11', 'un vendredi sur deux', '214 €', 'récompense à offrir'],
  ['Résidence Les Tilleuls', 'Pro · Collectivité', 'hebdo', null, 'pro', 'mardi 10/11', 'le mardi', '9 840 €', ''],
  ['Crèche Les Petits Pas', 'Pro · Collectivité', 'regulier', null, 'pro', 'lundi 16/11', 'le lundi', '4 210 €', 'facture d’octobre à faire', true],
  ['Bureau Notaire Exemple', 'Pro · Entreprise', 'occasionnel', null, 'pro', 'mercredi 11/11', 'en livraison au bureau', '2 980 €', ''],
  ['Thomas Peeters', 'Particulier', 'decouverte', ['down', 'septembre'], ['vienno', 2], '22/09', 'perdu de vue · 55 jours', '96 €', 'ajouter un e-mail', true],
  ['Lucas Martin', 'Particulier', 'decouverte', null, null, 'mardi 10/11', 'venu une fois', '18 €', 'lui proposer la carte'],
  ['Société Événements Exemple', 'Pro · Entreprise', 'occasionnel', null, 'pro', 'vendredi 30/10', 'chaque mois', '1 760 €', 'TVA invalide', true],
  ['Nadia El Amrani', 'Particulier', 'hebdo', null, ['vienno', 4], 'samedi 14/11', 'le samedi', '402 €', ''],
  ['Pierre Lemaire', 'Particulier', 'regulier', null, ['points', 41], 'dimanche 08/11', 'deux dimanches par mois', '176 €', ''],
  ['Elise Janssens', 'Particulier', 'occasionnel', ['down', 'août'], ['vienno', 6], 'samedi 24/10', 'une fois par mois', '95 €', '']
];
const lignes = C.map(([nom, type, k, evo, ca, der, ry, eur, af, rouge]) => `<tr class="${nom === 'Camille Lambert' ? 'tr-sel' : ''}">
    <td><span class="nom">${nom}</span><span class="sub"${type.startsWith('Pro') ? ' style="color:var(--prize-ink)"' : ''}>${type}</span></td>
    <td>${nivTag(k)}${evo ? `<span class="sub"><span class="cl-evo ${evo[0]}" style="margin:0">${evo[0] === 'up' ? '↑' : '↓'} depuis ${evo[1]}</span></span>` : ''}</td>
    <td>${ca === 'pro' ? '<span class="cl-pas">client pro · sa remise</span>' : ca ? carteCell(ca) : '<span class="cl-pas prop">✕ pas de carte</span>'}</td>
    <td>${der}<span class="sub">${ry}</span></td>
    <td style="text-align:right">${eur}</td>
    <td>${af ? `<span class="cl-af${rouge ? ' ko' : ''}">${af}</span>` : ''}</td><td class="cl-chev">›</td></tr>`).join('');
const corps = `
  <div class="px-top"><p class="px-intro">Vos clients, leur niveau de fidélité et leur carte. Une ligne ouvre la fiche.</p><span class="px-btn p">+ Nouveau client</span></div>
  <div class="px-tabs"><button class="on">Tous<span class="n">1 284</span></button><button>Particuliers<span class="n">1 236</span></button><button>Pros<span class="n">48</span></button><button>Sans carte<span class="n">488</span></button><button>À compléter<span class="n">312</span></button></div>
  <div class="cl-nivs">${tuiles}</div>
  <div class="cl-filtres"><span class="px-in" style="min-width:300px">🔍 Nom, e-mail, téléphone, n° de TVA…</span><span class="px-in">Niveau ▾</span><span class="px-in">Carte ▾</span><span style="flex:1"></span><span class="px-in">Exporter ▾</span></div>
  <div class="db-card"><div class="cl-defile"><table class="px-t cl-t"><thead><tr><th>Client</th><th>Niveau</th><th>Carte</th><th>Dernier passage</th><th style="text-align:right">12 mois</th><th>À faire</th><th></th></tr></thead><tbody>${lignes}</tbody></table></div>
    <div class="cl-ligne"><span><b>1 284</b> clients · les plus fidèles d’abord</span></div></div>`;
coque({ actif: 'clients', titre: 'Clients', corps,
  pied: 'Maquette v2 (lean) du 16/11/2026 · noms et chiffres d’exemple. Niveau : le profil de l’onglet Fidélité (src/fidelite_profils.php) ; carte et solde : l’ERP (Fidélité › cartes) ; fiche : le panel (/shops/{id}/clients/{id}). Barres de défilement : un filet Ruby de 3 px.' });
</script></body></html>
