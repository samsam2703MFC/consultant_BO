<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette — Temps morts au comptoir</title>
<!-- Cockpit › Magasins › Temps morts. Une page, deux lectures :
       ?v=reseau        les quatre magasins côte à côte (défaut)
       ?v=2|3|4|5       un magasin : Corbais, Gosselies, Halle, Sombreffe
       &seuil=5|10|15   la durée minimale d'un temps mort (10 min par défaut)
     Chiffres : tickets par heure, jour par jour, des 4 magasins du lundi 07/09 au dimanche 01/11/2026
     (heures.json, lus sur /ventes/periodes), passés dans calculer.js → data.json. -->
<link rel="stylesheet" href="../../../public/assets/ds/global.css">
<style>
  body{font-size:13px;line-height:1.45}
  .topbar{align-items:flex-end}
  .topbar .sous{font-size:12px;color:var(--muted);margin-top:6px;max-width:820px}
  .corps{padding:18px 24px 40px;max-width:1392px}
  .ligne{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .seg-lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .page-tabs{margin-top:2px}
  .carte{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .carte>.ct{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .carte>.ct .titre{font-size:15px}
  .carte>.ct .aide{font-size:11.5px;color:var(--muted);margin-left:auto}
  .carte .pad{padding:14px 18px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .kpis .kpi{border-left:3px solid var(--line);min-width:0}
  .kpis .kpi:first-child{border-left-color:transparent}
  .kpis .nom{font-size:12.5px;color:var(--muted-2);margin-bottom:4px}
  .kpis .kpi__note b{color:var(--ink)}
  .deux{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
  /* tableau des jours */
  table.tj{width:100%;border-collapse:collapse;font-size:13px}
  table.tj th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--table-head);padding:9px 10px;text-align:center}
  table.tj th:first-child{text-align:left;padding-left:18px}
  table.tj td{padding:6px 5px;border-top:1px solid var(--row-line);text-align:center}
  table.tj td:first-child{text-align:left;padding-left:18px;white-space:nowrap}
  table.tj td.moy{background:var(--total-line)}
  .case{border-radius:7px;padding:7px 4px 6px;line-height:1.15;font-variant-numeric:tabular-nums}
  .case .v{font-size:16px;letter-spacing:-.01em}
  .case .s{display:block;font-size:10.5px;margin-top:2px;opacity:.85}
  /* carte de chaleur */
  .hm{display:grid;gap:3px;padding:14px 18px 8px;font-variant-numeric:tabular-nums}
  .hm .h{font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-align:center;padding-bottom:2px}
  .hm .j{font-size:12.5px;display:flex;align-items:center;white-space:nowrap}
  .hm .c{border-radius:6px;min-height:38px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:default}
  .hm .c.vide{background:repeating-linear-gradient(135deg,#fff 0 4px,var(--table-head) 4px 8px);color:var(--faint)}
  .hm .c.mince{opacity:.55}
  .hm .c sup{font-size:9px;margin-left:1px;vertical-align:4px}
  .hm .r{font-size:12px;display:flex;flex-direction:column;justify-content:center;padding-left:8px;line-height:1.2}
  .hm .r small{font-size:10.5px;color:var(--muted)}
  .hm .moy{border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
  .leg{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:6px 18px 14px}
  .leg .rampe{display:flex;gap:2px}
  .leg .rampe span{width:34px;height:14px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9.5px}
  .leg .hach{display:inline-block;width:18px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;background:repeating-linear-gradient(135deg,#fff 0 4px,var(--table-head) 4px 8px);border:1px solid var(--line)}
  /* barres */
  .barres{display:grid;align-items:end;gap:6px;height:180px;padding:30px 18px 0;position:relative}
  .barres .b{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:default}
  .barres .b i{display:block;width:70%;max-width:34px;background:var(--chart-real);border-radius:4px 4px 0 0}
  .barres .b:hover i{background:#8f2338}
  .barres .b em{position:absolute;font-style:normal;font-size:11px;color:var(--ink);transform:translateY(-16px)}
  .barres .base{position:absolute;left:18px;right:18px;bottom:0;border-top:1px solid var(--line)}
  .barres-x{display:grid;gap:6px;padding:5px 18px 14px;font-size:10.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
  .barres-x small{display:block;color:var(--faint)}
  /* listes */
  .pire{list-style:none;margin:0;padding:4px 18px 8px}
  .pire li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--row-line)}
  .pire li:first-child{border-top:none}
  .pire .pct{width:46px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-variant-numeric:tabular-nums}
  .pire .n{font-size:13px}.pire .s{font-size:11.5px;color:var(--muted)}
  .pire .m{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}.pire .m small{display:block;font-size:10.5px;color:var(--muted)}
  .lecture{margin:0;padding:6px 18px 12px 34px;font-size:12.5px;line-height:1.55;color:var(--muted-2)}
  .lecture li{margin:6px 0}
  .lecture li b{color:var(--ink)}
  .methode{font-size:11.5px;color:var(--muted);line-height:1.55;padding:12px 18px}
  .methode p{margin:0 0 6px}
  .methode b{color:var(--ink)}
  .topbar .sous b{color:var(--ink)}
  .pied{display:flex;gap:8px;align-items:center;padding:4px 18px 14px}
  /* info-bulle */
  #bulle{position:fixed;pointer-events:none;z-index:10;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;min-width:180px;display:none;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  #bulle .t{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  #bulle b{color:var(--ink);font-size:13px}
  #bulle{color:var(--muted-2)}
</style>
</head>
<body>
<div id="ecran"></div>
<div id="bulle"></div>
<script>
const P = new URLSearchParams(location.search);
const ETAT = { v: P.get('v') || 'reseau', seuil: Number(P.get('seuil') || 10) };
const JOURS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const JC = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const nf = (n, d = 0) => Number(n).toLocaleString('fr-BE', { minimumFractionDigits: d, maximumFractionDigits: d });
const duree = m => { m = Math.round(m); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); };
const pc = v => v == null ? '—' : nf(v) + ' %';
const dateFr = d => new Date(d + 'T12:00:00Z').toLocaleDateString('fr-BE', { day: 'numeric', month: 'long', timeZone: 'UTC' });

// Une seule teinte, du clair au foncé : la part de l'heure passée sans client.
const RAMPE = [
  { max: 10, fond: '#F7EDEF', txt: 'var(--ink)', lab: '< 10' },
  { max: 25, fond: '#EFD3D9', txt: 'var(--ink)', lab: '10–25' },
  { max: 40, fond: '#E2AAB5', txt: 'var(--ink)', lab: '25–40' },
  { max: 55, fond: '#CF7488', txt: 'var(--ink)', lab: '40–55' },
  { max: 70, fond: '#B03048', txt: '#fff', lab: '55–70' },
  { max: 101, fond: '#7C1C30', txt: '#fff', lab: '≥ 70' },
];
const teinte = pct => RAMPE.find(r => pct < r.max) || RAMPE[RAMPE.length - 1];
const styleCase = pct => { const t = teinte(pct); return `background:${t.fond};color:${t.txt}`; };

fetch('data.json').then(r => r.json()).then(D => {
  const IDS = Object.keys(D.magasins);
  const S = () => String(ETAT.seuil);

  const legende = () => `<div class="leg"><span>part de l’heure sans client</span><span class="rampe">${RAMPE.map(r => `<span style="background:${r.fond};color:${r.txt}">${r.lab}</span>`).join('')}</span><span>%</span>
    <span><i class="hach"></i>fermé à cette heure</span><span style="margin-left:auto">* heure d’ouverture ou de fermeture, surestimée si le magasin ouvre ou ferme à la demi-heure · pâli : moins de 20 min ouvertes dans l’heure</span></div>`;

  const bulleCase = (titre, H, Hs) => `<div class='t'>${esc(titre)}</div><b>${pc(Hs.pct)}</b> de l’heure sans client<br>${nf(Hs.min)} min mortes sur ${nf(H.ouvert)} min ouvertes<br>${nf(Hs.nb, 1)} temps mort${Hs.nb >= 2 ? 's' : ''} commencé${Hs.nb >= 2 ? 's' : ''} dans l’heure<br>${nf(H.tk, 1)} tickets · ${nf(H.ca)} € en moyenne`;

  // La carte de chaleur : des lignes (jours ou magasins) × les heures.
  function carte(lignes, heures, colDroite) {
    // L.bords : les heures de bord de la ligne (ouverture, fermeture).
    const cols = `110px repeat(${heures.length}, minmax(0,1fr))` + (colDroite ? ' 128px' : '');
    let h = `<div class="hm" style="grid-template-columns:${cols}"><div class="h"></div>` + heures.map(x => `<div class="h">${x} h</div>`).join('') + (colDroite ? `<div class="h" style="text-align:left;padding-left:8px">${esc(colDroite)}</div>` : '');
    for (const L of lignes) {
      const cls = L.moy ? ' moy' : '';
      h += `<div class="j${cls}">${esc(L.nom)}</div>`;
      for (const x of heures) {
        const H = L.agg.heures?.[x], Hs = L.agg.seuils?.[S()].heures?.[x];
        if (!H || Hs?.pct == null) { h += `<div class="c vide${cls}" data-tip="${esc(`<div class='t'>${esc(L.nom)} · ${x} h</div>fermé à cette heure`)}">·</div>`; continue; }
        const bord = (L.bords || []).includes(x);
        h += `<div class="c${H.ouvert < 20 ? ' mince' : ''}${cls}" style="${styleCase(Hs.pct)}" data-tip="${esc(bulleCase(L.nom + ' · ' + x + ' h', H, Hs) + (bord ? `<br><span style='color:var(--muted)'>heure d’ouverture ou de fermeture : surestimée si le magasin ouvre ou ferme à la demi-heure</span>` : ''))}">${nf(Hs.pct)}${bord ? '<sup>*</sup>' : ''}</div>`;
      }
      if (colDroite) { const A = L.agg.seuils[S()]; h += `<div class="r${cls}"><span>${nf(A.nb, 1)} / jour</span><small>${duree(A.min)} sans client</small></div>`; }
    }
    return h + '</div>';
  }

  // Le repère : à tickets répartis au hasard, la part du temps passée dans des trous d'au moins T minutes vaut
  // e^(−x)·(1 + x), avec x = T × tickets par minute. Elle vaut la moitié pour x ≈ 1,678.
  const repere = () => Math.round(60 * 1.678 / ETAT.seuil);
  const bordsSemaine = m => { const n = {}; Object.values(m.bords).flat().forEach(h => { n[h] = (n[h] || 0) + 1; }); return Object.keys(n).map(Number).filter(h => n[h] >= 4); };
  const partBords = () => { const p = IDS.map(i => { const A = D.magasins[i].semaine.seuils[S()]; return 100 * A.minBords / A.min; }); return nf(Math.min(...p)) + ' à ' + nf(Math.max(...p)) + ' %'; };
  const heuresDe = aggs => [...new Set(aggs.flatMap(a => Object.keys(a.heures || {}).map(Number)))].sort((a, b) => a - b);
  const moyPlage = (agg, de, a) => { let m = 0, o = 0; for (let h = de; h <= a; h++) { const H = agg.heures[h], Hs = agg.seuils[S()].heures[h]; if (!H) continue; m += Hs.min; o += H.ouvert; } return { pct: o ? 100 * m / o : null, min: m }; };
  const nbPlage = (agg, de, a) => { let n = 0; for (let h = de; h <= a; h++) { const Hs = agg.seuils[S()].heures[h]; if (Hs) n += Hs.nb; } return n; };

  function enTete() {
    const t = ETAT.v === 'reseau' ? 'Les temps morts au comptoir' : 'Les temps morts — ' + D.magasins[ETAT.v].nom;
    return `<header class="topbar"><div><p class="topbar__kicker">Cockpit › Magasins › Temps morts</p><h1>${esc(t)}</h1>
      <div class="sous">Un temps mort : <b>${ETAT.seuil} minutes ou plus sans un seul ticket</b>, entre le premier et le dernier ticket de la journée. Moyenne de 8 semaines pleines, du lundi ${dateFr(D.meta.du)} au dimanche ${dateFr(D.meta.au)} 2026 — 56 journées par magasin.</div></div>
      <div class="topbar__actions"><span class="seg-lab">Temps mort dès</span><div class="seg" role="group" aria-label="Durée minimale d’un temps mort">${D.meta.seuils.map(s => `<button type="button" data-seuil="${s}" class="${s === ETAT.seuil ? 'is-on' : ''}">${s} min</button>`).join('')}</div></div></header>`;
  }
  const onglets = () => `<nav class="page-tabs">${[['reseau', 'Réseau'], ...IDS.map(i => [i, D.magasins[i].nom])].map(([k, n]) => `<button type="button" class="page-tabs__tab${ETAT.v === k ? ' is-on' : ''}" data-v="${k}">${esc(n)}</button>`).join('')}</nav>`;

  const methode = () => `<div class="carte"><div class="methode">
    <p><b>Comment c’est calculé.</b> Le panel donne le nombre de tickets de chaque heure, jour par jour, mais pas la minute de chaque ticket. Les tickets d’une heure sont donc répartis au hasard dans cette heure, 500 fois par journée, et l’on garde la moyenne : un trou d’au moins ${ETAT.seuil} minutes entre deux tickets est un temps mort, et toute sa durée compte.</p>
    <p>Vérifié sur les tickets réels, semaine du 26/10 au 01/11, quatre magasins : <b>423 temps morts mesurés pour 422 estimés</b>, 3 % de minutes mortes en moins. Juste en moyenne ; sur un jour donné, l’écart va jusqu’à ±20 %. L’attente avant le premier client du matin et ce qui suit le dernier ticket ne comptent pas ; un ticket isolé à 5 h ou à 21 h non plus (une heure n’est retenue que si le magasin y vend plus d’un jour sur deux, 2 tickets au moins en moyenne).</p>
    <p>À l’inverse, <b>la première et la dernière heure (*) sont surestimées</b> si le magasin ouvre ou ferme à la demi-heure : leurs tickets sont étalés sur l’heure entière. Elles portent ${partBords()} des minutes mortes au seuil de ${ETAT.seuil} min ; leur part est donnée à côté de chaque total, et elles sont écartées du classement des heures les plus mortes.</p>
    <p>Source : <code>/ventes/periodes</code> (panel, hourly-distribution) · ${D.meta.tirages} tirages par journée · calculé le ${new Date(D.meta.calculeLe).toLocaleDateString('fr-BE')}.</p></div></div>`;

  /* ---------- le réseau ------------------------------------------------------ */
  function ecranReseau() {
    const M = IDS.map(i => D.magasins[i]);
    const kpis = `<div class="kpis">${M.map(m => { const A = m.semaine.seuils[S()]; return `<div class="kpi"><div class="nom">${esc(m.nom)}</div><div class="kpi__value">${nf(A.nb, 1)}</div><div class="kpi__label">temps morts par jour</div>
      <div class="kpi__note"><b>${duree(A.min)}</b> sans client, <b>${pc(A.pct)}</b> de l’ouverture</div><div class="kpi__note">dont ${duree(A.minBords)} à l’ouverture et à la fermeture</div><div class="kpi__note">le plus long : ${nf(m.semaine.plusLong)} min, vers ${m.semaine.plusLongHeure} h · ${nf(m.semaine.tickets)} tickets / jour</div></div>`; }).join('')}</div>`;

    // Magasins × jours de la semaine.
    const tj = `<table class="tj"><thead><tr><th>Magasin</th>${JC.map(j => `<th>${j}</th>`).join('')}<th>Moyenne</th></tr></thead><tbody>${M.map(m => {
      const c = (agg, moy) => { const A = agg.seuils[S()]; return `<td class="${moy ? 'moy' : ''}"><div class="case" style="${styleCase(A.pct)}" data-tip="${esc(`<div class='t'>${esc(m.nom)}${moy ? ' · semaine' : ''}</div><b>${nf(A.nb, 1)}</b> temps morts par jour<br>${duree(A.min)} sans client sur ${duree(agg.ouvert)} d’ouverture (${pc(A.pct)})<br>${nf(agg.tickets)} tickets par jour · ${agg.jours} journées`)}"><span class="v">${nf(A.nb, 1)}</span><span class="s">${duree(A.min)} · ${pc(A.pct)}</span></div></td>`; };
      return `<tr><td>${esc(m.nom)}</td>${[0, 1, 2, 3, 4, 5, 6].map(w => c(m.jours[w])).join('')}${c(m.semaine, true)}</tr>`; }).join('')}</tbody></table>`;

    const heures = heuresDe(M.map(m => m.semaine)).filter(h => M.some(m => (m.semaine.heures[h]?.ouvert || 0) >= 20));
    const hm = carte(M.map(m => ({ nom: m.nom, agg: m.semaine, bords: bordsSemaine(m) })), heures);

    // Ce qui se lit.
    const pm = M.map(m => ({ nom: m.nom, midi: moyPlage(m.semaine, 11, 12), aprem: moyPlage(m.semaine, 14, 17), matin: moyPlage(m.semaine, 7, 10), nAprem: nbPlage(m.semaine, 14, 17), nb: m.semaine.seuils[S()].nb }));
    const pire = [...pm].sort((a, b) => b.aprem.pct - a.aprem.pct)[0];
    const we = M.map(m => ({ nom: m.nom, sem: (m.jours[0].seuils[S()].nb + m.jours[1].seuils[S()].nb + m.jours[2].seuils[S()].nb + m.jours[3].seuils[S()].nb + m.jours[4].seuils[S()].nb) / 5, we: (m.jours[5].seuils[S()].nb + m.jours[6].seuils[S()].nb) / 2 }));
    const parPct = [...M].sort((a, b) => a.semaine.seuils[S()].pct - b.semaine.seuils[S()].pct), moinsMort = parPct[0], reste = parPct.slice(1);
    const lecture = `<ul class="lecture">
      <li><b>L’après-midi, de 14 h à 18 h, est le grand creux du réseau</b> : ${pm.map(p => `${esc(p.nom)} ${pc(p.aprem.pct)}`).join(', ')} du temps sans client. Il porte ${nf(pm.reduce((a, p) => a + p.nAprem, 0) / pm.length, 1)} des ${nf(pm.reduce((a, p) => a + p.nb, 0) / pm.length, 1)} temps morts d’une journée moyenne. Le plus touché : ${esc(pire.nom)}.</li>
      <li><b>Le midi est le moment le plus plein</b> : de 11 h à 13 h, ${pm.map(p => `${esc(p.nom)} ${pc(p.midi.pct)}`).join(', ')}. Le matin, de 7 h à 11 h, vient entre les deux : ${pm.map(p => `${esc(p.nom)} ${pc(p.matin.pct)}`).join(', ')}.</li>
      <li><b>Le week-end remplit le comptoir</b> — temps morts par jour, week-end contre semaine : ${we.map(x => `${esc(x.nom)} ${nf(x.we, 1)} contre ${nf(x.sem, 1)}`).join(' · ')}.</li>
      <li><b>${esc(moinsMort.nom)} vend le plus</b> (${nf(moinsMort.semaine.tickets)} tickets par jour) et a le moins de temps mort : ${pc(moinsMort.semaine.seuils[S()].pct)} de l’ouverture sans client, contre ${pc(reste[0].semaine.seuils[S()].pct)} à ${pc(reste[reste.length - 1].semaine.seuils[S()].pct)} pour les trois autres.</li>
      <li><b>Repère</b> : sous <b>${repere()} tickets dans l’heure</b>, plus de la moitié de l’heure se passe sans client. C’est le nombre de clients à viser sur les heures creuses.</li></ul>`;

    return enTete() + `<div class="corps">${onglets()}${kpis}
      <div class="carte"><div class="ct"><span class="titre">Temps morts par jour, jour de semaine par jour de semaine</span><span class="aide">le nombre de temps morts · le temps sans client · sa part de l’ouverture</span></div><div style="padding:6px 0 10px">${tj}</div></div>
      <div class="carte"><div class="ct"><span class="titre">Part de chaque heure passée sans client — moyenne des sept jours</span><span class="aide">survolez une case pour le détail</span></div>${hm}${legende()}</div>
      <div class="deux"><div class="carte"><div class="ct"><span class="titre">Ce qui se lit</span></div>${lecture}</div>${methode()}</div></div>`;
  }

  /* ---------- un magasin ----------------------------------------------------- */
  function ecranMagasin(sid) {
    const m = D.magasins[sid], A = m.semaine.seuils[S()];
    const ws = [0, 1, 2, 3, 4, 5, 6];
    const plein = ws.map(w => ({ w, nb: m.jours[w].seuils[S()].nb })).sort((a, b) => a.nb - b.nb);
    const kpis = `<div class="kpis">
      <div class="kpi"><div class="kpi__value">${nf(A.nb, 1)}</div><div class="kpi__label">temps morts par jour</div><div class="kpi__note">de ${nf(plein[0].nb, 1)} le ${JOURS[plein[0].w].toLowerCase()} à ${nf(plein[6].nb, 1)} le ${JOURS[plein[6].w].toLowerCase()}</div></div>
      <div class="kpi"><div class="kpi__value">${duree(A.min)}</div><div class="kpi__label">sans client par jour</div><div class="kpi__note">sur ${duree(m.semaine.ouvert)} entre le premier et le dernier ticket</div><div class="kpi__note">dont ${duree(A.minBords)} à l’ouverture et à la fermeture</div></div>
      <div class="kpi"><div class="kpi__value">${pc(A.pct)}</div><div class="kpi__label">de l’ouverture sans client</div><div class="kpi__note">${nf(m.semaine.tickets)} tickets par jour en moyenne</div></div>
      <div class="kpi"><div class="kpi__value">${nf(m.semaine.plusLong)} min</div><div class="kpi__label">le plus long trou du jour</div><div class="kpi__note">tombe le plus souvent vers ${m.semaine.plusLongHeure} h</div></div></div>`;

    const heures = heuresDe(ws.map(w => m.jours[w]));
    const lignes = ws.map(w => ({ nom: JOURS[w], agg: m.jours[w], bords: m.bords[w] })).concat([{ nom: 'Moyenne', agg: m.semaine, moy: true, bords: bordsSemaine(m) }]);
    const hm = carte(lignes, heures, 'par jour');

    // Les temps morts d'une journée moyenne, heure par heure.
    const H = m.semaine.seuils[S()].heures, hb = heures.filter(h => H[h]);
    const max = Math.max(...hb.map(h => H[h].nb)), top = [...hb].sort((a, b) => H[b].nb - H[a].nb).slice(0, 3);
    const gc = `grid-template-columns:repeat(${hb.length},minmax(0,1fr))`;
    const barres = `<div class="barres" style="${gc}">${hb.map(h => `<div class="b" data-tip="${esc(bulleCase(m.nom + ' · ' + h + ' h · moyenne', m.semaine.heures[h], H[h]))}"><i style="height:${(100 * H[h].nb / max).toFixed(1)}%"></i>${top.includes(h) ? `<em style="bottom:${(100 * H[h].nb / max).toFixed(1)}%">${nf(H[h].nb, 1)}</em>` : ''}</div>`).join('')}<div class="base"></div></div>
      <div class="barres-x" style="${gc}">${hb.map(h => `<div>${h} h<small>${nf(m.semaine.heures[h].tk)} tickets</small></div>`).join('')}</div>`;

    // Les créneaux les plus morts : un jour, une heure pleine d'ouverture, classés par minutes perdues.
    const cr = [];
    for (const w of ws) for (const h of heures) { const X = m.jours[w].heures[h], Xs = m.jours[w].seuils[S()].heures[h]; if (X && Xs?.pct != null && X.ouvert >= 45 && !m.bords[w].includes(h)) cr.push({ w, h, X, Xs }); }
    cr.sort((a, b) => b.Xs.min - a.Xs.min);
    const pire = `<ul class="pire">${cr.slice(0, 6).map(c => `<li><span class="pct" style="${styleCase(c.Xs.pct)}">${nf(c.Xs.pct)} %</span><div><div class="n">${JOURS[c.w]}, ${c.h} h – ${c.h + 1} h</div><div class="s">${nf(c.X.tk, 1)} tickets dans l’heure · ${nf(c.X.ca)} € · ${nf(c.Xs.nb, 1)} temps morts</div></div><div class="m">${nf(c.Xs.min)} min<small>sans client</small></div></li>`).join('')}</ul>
      <div class="pied"><a class="btn btn--sm" href="#">Ouvrir ces créneaux dans Jours creux ›</a><span class="muted" style="font-size:11.5px">générer une promotion pour les remplir</span></div>`;

    const midi = moyPlage(m.semaine, 11, 12), aprem = moyPlage(m.semaine, 14, 17), matin = moyPlage(m.semaine, 7, 10);
    const lecture = `<ul class="lecture">
      <li><b>${pc(aprem.pct)} de l’après-midi sans client</b>, de 14 h à 18 h : ${nf(nbPlage(m.semaine, 14, 17), 1)} des ${nf(A.nb, 1)} temps morts de la journée.</li>
      <li><b>Le midi est le plus plein</b> : ${pc(midi.pct)} sans client de 11 h à 13 h. Le matin, de 7 h à 11 h : ${pc(matin.pct)}.</li>
      <li><b>Repère</b> : sous ${repere()} tickets dans l’heure, plus de la moitié de l’heure se passe sans client.</li>
      <li><b>Jour le plus calme : ${JOURS[plein[6].w].toLowerCase()}</b> (${nf(plein[6].nb, 1)} temps morts, ${duree(m.jours[plein[6].w].seuils[S()].min)} sans client). Le plus plein : ${JOURS[plein[0].w].toLowerCase()} (${nf(plein[0].nb, 1)}).</li></ul>`;

    return enTete() + `<div class="corps">${onglets()}${kpis}
      <div class="carte"><div class="ct"><span class="titre">Part de chaque heure passée sans client, jour par jour</span><span class="aide">moyenne des 8 mêmes jours de semaine · à droite, les temps morts d’une journée</span></div>${hm}${legende()}</div>
      <div class="deux">
        <div class="carte"><div class="ct"><span class="titre">Les temps morts d’une journée moyenne, heure par heure</span><span class="aide">trous de ${ETAT.seuil} min ou plus, par heure de début</span></div>${barres}
          <div class="ct" style="border-top:1px solid var(--line)"><span class="titre">Ce qui se lit</span></div>${lecture}</div>
        <div class="carte"><div class="ct"><span class="titre">Les heures les plus mortes</span><span class="aide">minutes sans client, en moyenne · hors ouverture et fermeture</span></div>${pire}</div>
      </div>${methode()}</div>`;
  }

  /* ---------- rendu et branchements ------------------------------------------ */
  const E = document.getElementById('ecran'), B = document.getElementById('bulle');
  function rendre() {
    E.innerHTML = ETAT.v === 'reseau' ? ecranReseau() : ecranMagasin(ETAT.v);
    const q = new URLSearchParams({ v: ETAT.v, seuil: ETAT.seuil });
    history.replaceState(null, '', '?' + q);
  }
  E.addEventListener('click', e => {
    const s = e.target.closest('[data-seuil]'), v = e.target.closest('[data-v]');
    if (s) { ETAT.seuil = Number(s.dataset.seuil); rendre(); }
    if (v) { ETAT.v = v.dataset.v; rendre(); }
  });
  E.addEventListener('mousemove', e => {
    const c = e.target.closest('[data-tip]');
    if (!c) { B.style.display = 'none'; return; }
    B.innerHTML = c.dataset.tip; B.style.display = 'block';
    const w = B.offsetWidth, h = B.offsetHeight;
    B.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px';
    B.style.top = (e.clientY + 16 + h > innerHeight ? e.clientY - h - 12 : e.clientY + 16) + 'px';
  });
  E.addEventListener('mouseleave', () => { B.style.display = 'none'; });
  rendre();
  document.body.dataset.pret = '1';
});
</script>
</body>
</html>
