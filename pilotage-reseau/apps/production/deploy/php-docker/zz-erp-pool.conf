; [297] Pool FPM de l'ERP : écoute seulement sur la machine (réseau de l'hôte), port lu par Apache (proxy_fcgi).
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9083
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
request_terminate_timeout = 310
clear_env = no
catch_workers_output = yes
