     comme sous un sous-répertoire (ex. /consulant_bo/). -->

<script>
// Mode incorporé (design system §9) : la page servie dans le cadre du module
// Marketing (?embed=1 dans un iframe) masque son rail — celui du Marketing
// est déjà à gauche — et garde embed=1 sur ses liens internes.
(function () {
  try {
    var embed = new URLSearchParams(location.search).get('embed') === '1' && window.parent !== window;
    if (!embed) { return; }
    document.documentElement.classList.add('is-embedded');
    var garde = function (a) {
      var href = a.getAttribute('href');
      if (!href || href.charAt(0) === '#' || /^(mailto|tel|javascript):/i.test(href)) { return; }
      var url = new URL(href, location.href);
      if (url.origin === location.origin && !url.searchParams.has('embed')) {
        url.searchParams.set('embed', '1');
        a.setAttribute('href', url.pathname + url.search + url.hash);
      }
    };
    // Les écrans sont dessinés après le chargement : on garde le lien au moment du clic.
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (a) { garde(a); }
    }, true);
  } catch (e) { /* sans cadre : la page seule */ }
})();
</script>
<script>
// L'application tablette du consultant (10/10/2026) : ?app=consultant ouvre la fiche franchisé en plein écran,
// installable sur l'écran d'accueil (manifeste dédié). Le cockpit reste le même ailleurs.
(function () {
  try {
    if (new URLSearchParams(location.search).get('app') !== 'consultant') { return; }
    document.documentElement.setAttribute('data-app', 'consultant');
    var l = document.createElement('link'); l.rel = 'manifest'; l.href = 'consultant.webmanifest'; document.head.appendChild(l);
    if (!location.hash || location.hash === '#' || location.hash === '#/') { location.hash = '#/fiche'; }
  } catch (e) { /* sans app : le cockpit */ }
})();
</script>
<script>
// Au téléphone (07/11/2026) : l'écran Résultat s'ouvre dans sa vue téléphone (resultat-mobile/), une colonne,
// Jour / Semaine / Mois. « Version complète » (?bureau=1) garde le cockpit de bureau pour la session.
(function () {
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('embed') === '1' || q.get('app')) { return; }
    if (q.get('bureau') === '1') { sessionStorage.setItem('cockpit.bureau', '1'); return; }
    if (sessionStorage.getItem('cockpit.bureau') === '1') { return; }
    var etroit = function () { return window.matchMedia && matchMedia('(max-width: 760px)').matches; };
    var resultat = function () { var h = location.hash || ''; return !h || h === '#' || h === '#/' || /^#\/(resultat|resultat-du-jour|performance)(\?|$|\/)/.test(h); };
    var aller = function () { if (etroit() && resultat()) { location.replace('resultat-mobile/'); } };
    aller();
    window.addEventListener('hashchange', aller);
  } catch (e) { /* le cockpit de bureau */ }
})();
</script>
