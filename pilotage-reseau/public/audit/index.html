<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Audit fournisseurs — L'Atelier by</title>
<!-- L'audit des fournisseurs (12/11/2026) : la page que le franchisé ouvre avec son lien personnel (?d=&jeton=), sans
     mot de passe. Un écran par fournisseur, enregistré à chaque « Suivant » ; on peut fermer et reprendre avec le même
     lien jusqu'à la clôture. Les points ne sont pas montrés. ?apercu=1[&c=] : la vue du bureau (Pilotage › Audit
     fournisseurs), rien n'est enregistré. Chemins RELATIFS : la page vit sous /audit/, l'API sous ../api/cockpit
     (routes publiques /audits/public, src/audits.php). -->
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/ds/global.css">
<style>
  body{margin:0;background:var(--color-background,#F6F1EC);color:var(--color-text,var(--ink));font-family:var(--font-ui)}
  .au{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
  .au-hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.au-hd img{height:22px}
  .au-hd h1{font:400 24px/1.1 var(--font-display);margin:0}.au-hd small{display:block;font-size:12px;color:var(--color-text-muted)}
  .au-apercu{background:var(--prize-soft);color:var(--prize-ink);border-radius:10px;padding:8px 12px;font-size:12.5px}
  .au-carte{background:var(--color-surface,#fff);border:1px solid var(--color-border-tertiary,#e5ddd5);border-radius:12px;padding:14px 16px}
  .au-carte h2{font:400 21px/1.15 var(--font-display);margin:0 0 4px}
  .au-mu{font-size:12.5px;color:var(--color-text-muted);line-height:1.5}
  .au-four{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--color-border-tertiary,#e5ddd5);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit;color:inherit}
  .au-four:first-of-type{border-top:none}
  .au-four .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;background:var(--chip,#efe8e1);color:var(--muted-2,#6b6259)}
  .au-four .n.ok{background:var(--green,#2f6b3a);color:#fff}.au-four .n.cours{background:var(--color-primary,#8D1D2C);color:#fff}
  .au-four b{display:block;font-size:14.5px;font-weight:400}.au-four small{font-size:12px;color:var(--color-text-muted)}
  .au-prog{display:flex;gap:4px}.au-prog i{flex:1;height:4px;border-radius:4px;background:var(--color-border-tertiary,#e5ddd5)}.au-prog i.ok{background:var(--green,#2f6b3a)}.au-prog i.on{background:var(--color-primary,#8D1D2C)}
  .au-q{display:flex;flex-direction:column;gap:9px;padding:14px 0;border-top:1px solid var(--color-border-tertiary,#e5ddd5)}.au-q:first-of-type{border-top:none;padding-top:4px}
  .au-q.sous{margin-left:14px;padding-left:12px;border-left:2px solid var(--prize-soft,#f2e3c9)}
  .au-q > b{font-size:14.5px;font-weight:400;line-height:1.4}.au-q .aide{font-size:12.5px;color:var(--color-text-muted)}
  .au-q.manque > b{color:var(--stop,#b0402e)}
  .au-note{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .au-opt{border:1px solid var(--color-border-secondary,#cfc5bb);background:var(--color-surface,#fff);border-radius:8px;min-height:44px;padding:8px 12px;font:400 14px var(--font-ui);color:inherit;cursor:pointer;text-align:left}
  .au-note .au-opt{text-align:center;font-size:16px}
  .au-opt.on{background:var(--color-primary,#8D1D2C);border-color:var(--color-primary,#8D1D2C);color:#fff}
  .au-opts{display:flex;flex-direction:column;gap:6px}
  .au-bornes{display:flex;justify-content:space-between;font-size:11.5px;color:var(--color-text-muted)}
  .au-in,.au-ta{width:100%;box-sizing:border-box;border:1px solid var(--color-border-secondary,#cfc5bb);border-radius:8px;padding:10px 12px;font:16px/1.4 var(--font-ui);background:var(--color-surface,#fff);color:inherit}
  .au-ta{min-height:76px;resize:vertical}
  .au-com small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--prize-ink,#8a5a12);margin-bottom:4px}
  .au-ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.au-ph img{width:110px;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
  .au-err{font-size:12.5px;color:var(--stop,#b0402e)}
  .au-pied{position:fixed;left:0;right:0;bottom:0;background:var(--color-surface,#fff);border-top:1px solid var(--color-border-tertiary,#e5ddd5);padding:10px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .au-pied .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .au-btn{border:1px solid var(--color-border-secondary,#cfc5bb);background:var(--color-surface,#fff);border-radius:6px;min-height:46px;padding:0 18px;font:400 14px var(--font-ui);color:var(--color-text,var(--ink));cursor:pointer}
  .au-btn.prim{background:var(--color-primary,#8D1D2C);border-color:var(--color-primary,#8D1D2C);color:#fff;flex:1}.au-btn:disabled{opacity:.55;cursor:default}
  .au-ok{text-align:center;padding:26px 8px 10px}.au-ok .c{width:64px;height:64px;border-radius:50%;background:var(--green,#2f6b3a);color:#fff;display:grid;place-items:center;margin:0 auto 12px}
  .au-ok h2{margin:0 0 6px}
  .au-suite{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<main class="au" id="au"><p class="au-mu">Chargement…</p></main>
<div class="au-pied" id="pied" hidden><div class="in" id="pied-in"></div></div>
<script src="audit.js"></script>
</body>
</html>
